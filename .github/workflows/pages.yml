name: Deploy reader to GitHub Pages

# Publishes ONLY the reading experience (reader.html + the manuscript) to Pages.
# The outline, story bible, and other state files are deliberately NOT published,
# so the book's ending and continuity notes never go public.

on:
  push:
    branches: [main]
    paths:
      - "reader.html"
      - "app/**"
      - "manuscript/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site (reader + manuscript only)
        run: |
          set -e
          mkdir -p _site/manuscript
          cp reader.html _site/index.html      # front page = the reader
          cp reader.html _site/reader.html      # also reachable at /reader.html
          cp -R app _site/app                   # the ES modules + stylesheet
          cp manuscript/*.md _site/manuscript/
          cp manuscript/manifest.json _site/manuscript/
          echo "Published files:"; find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
