<!doctype html>
<html lang="en" data-mode="review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tower of Ardenmoor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efe9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ardenmoor">
<style>
  /* Only the tokens and the page ground live inline. An external stylesheet is
     render-blocking, so there is no flash in practice — but on a cold offline
     start these few lines guarantee the first paint is the right colour. */
  :root{
    color-scheme: light dark;
    --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb;
    --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14);
    --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12);
    --ring:#9a6a3a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c;
      --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5);
      --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16); --ring:#d0a06a;
    }
  }
  :root[data-theme="light"]{ color-scheme:light; --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb; --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14); --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12); --ring:#9a6a3a; }
  :root[data-theme="dark"]{ color-scheme:dark; --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c; --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5); --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16); --ring:#d0a06a; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:var(--fs,20px); line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  #status{max-width:38rem;margin:3rem auto;padding:0 1.4rem;color:var(--muted);text-align:center}
</style>
<link rel="stylesheet" href="app/app.css">
<!-- Every URL here is relative and root-less: the GitHub Pages mirror serves the
     app from /<repo>/, where an absolute /app/boot.js would 404. -->
<link rel="modulepreload" href="app/boot.js">
<link rel="modulepreload" href="app/config.js">
<link rel="modulepreload" href="app/storage.js">
<link rel="modulepreload" href="app/schedule.js">
<link rel="modulepreload" href="app/dom.js">
<link rel="modulepreload" href="app/toast.js">
<link rel="modulepreload" href="app/icons.js">
<link rel="modulepreload" href="app/text.js">
<link rel="modulepreload" href="app/diff.js">
<link rel="modulepreload" href="app/store.js">
<link rel="modulepreload" href="app/manuscript.js">
<link rel="modulepreload" href="app/position.js">
<link rel="modulepreload" href="app/render.js">
<link rel="modulepreload" href="app/popover.js">
<link rel="modulepreload" href="app/editor.js">
<link rel="modulepreload" href="app/composer.js">
<link rel="modulepreload" href="app/verify.js">
<link rel="modulepreload" href="app/sync.js">
<link rel="modulepreload" href="app/exports.js">
<link rel="modulepreload" href="app/shell.js">
<link rel="modulepreload" href="app/panels.js">
<link rel="modulepreload" href="app/gestures.js">
</head>
<body>
<div id="ticks"></div>
<div id="progress"></div>

<header id="bar">
  <button id="btnMenu" class="iconbtn" aria-label="Open menu and contents" aria-expanded="false"></button>
  <span class="spacer"></span>
  <button id="btnMode" class="pill" aria-label="Toggle read or review mode"></button>
  <span class="spacer"></span>
  <button id="btnSettings" class="iconbtn" aria-label="Settings" aria-expanded="false"></button>
</header>

<div id="scrim"></div>

<aside id="drawer" aria-label="Contents and feedback" aria-hidden="true" inert>
  <div class="dhead">
    <p class="bktitle">The Tower of Ardenmoor</p>
    <div class="pct"><span id="bookPct">0</span>% through the book</div>
    <div class="mini"><i id="miniFill"></i></div>
  </div>
  <div class="sectLbl">Contents</div>
  <nav id="tocNav"></nav>
  <div class="sectLbl">Bookmark</div>
  <div class="bmrow">
    <button id="bmSet" aria-label="Bookmark the current spot"></button>
    <button id="bmGo" aria-label="Go to your bookmark"></button>
  </div>
  <section id="bookPanel" aria-label="Download the book">
    <div class="sectLbl">The book</div>
    <div class="exportRow">
      <button id="btnBookMd" class="primary">Download .md</button>
      <button id="btnBookPdf">Save as PDF</button>
    </div>
    <p class="bookHint" id="bookHint"></p>
  </section>

  <section id="feedbackPanel" aria-label="Feedback and export">
    <div class="sectLbl">Feedback</div>
    <div class="tabs">
      <button id="tabNotes" class="active" data-pane="notes">Notes</button>
      <button id="tabEdits" data-pane="edits">Track changes</button>
    </div>
    <div class="exportRow">
      <button id="btnCopy" class="primary">Copy for Claude</button>
      <button id="btnDownload">Download .md</button>
    </div>
    <div class="exportRow" style="border-top:1px solid var(--rule);margin-top:.2rem;padding-top:.8rem">
      <button id="btnSync">Turn on cross-device sync</button>
    </div>
    <div class="exportRow">
      <button id="btnClearAll" class="danger">Clear all notes and changes</button>
    </div>
    <div id="notesList"></div>
    <div id="editsList" style="display:none"></div>
  </section>
</aside>

<div id="settings" role="dialog" aria-label="Settings">
  <div class="setRow"><span class="lbl">Text size</span>
    <div class="seg"><button id="btnSmaller" class="segbtn" aria-label="Smaller text"></button><button id="btnBigger" class="segbtn" aria-label="Larger text"></button></div>
  </div>
  <div class="setRow"><span class="lbl">Theme</span>
    <div class="seg">
      <button class="segbtn" data-theme-set="auto" aria-label="Automatic theme">Auto</button>
      <button class="segbtn" data-theme-set="light" aria-label="Light theme"></button>
      <button class="segbtn" data-theme-set="dark" aria-label="Dark theme"></button>
    </div>
  </div>
  <div class="setRow" id="inlineRow"><span class="lbl">Inline editing</span>
    <div class="seg">
      <button class="segbtn" data-inline-set="on" aria-label="Inline editing on">On</button>
      <button class="segbtn" data-inline-set="off" aria-label="Inline editing off">Off</button>
    </div>
  </div>
  <p class="setHint" id="inlineHint">Click any paragraph to edit it where it sits. Saved as a tracked change.</p>
</div>

<div id="selTools">
  <button id="btnAddNote" aria-label="Add a note on the selection"></button>
  <button id="btnAddEdit" aria-label="Rewrite the selected paragraph"></button>
  <button id="btnAddBookmark" aria-label="Bookmark the selected passage"></button>
</div>

<main id="book"><p id="status">Gathering the pages…</p></main>

<div id="toast" aria-live="polite"></div>

<script type="module" src="app/boot.js"></script>
<script>
  /* Failure surface. A module-graph failure is fatal and SILENT — there is no
     onerror for it — unlike the old single file, where the browser either ran it
     or showed nothing at all. boot.js sets window.__ardenmoorBooted; if it has
     not within 8 s, say so instead of showing a blank page forever.
     This script is deliberately classic, not a module: it has to run even when
     the module graph is dead. */
  setTimeout(function () {
    if (window.__ardenmoorBooted) return;
    var b = document.getElementById("book");
    if (b) b.innerHTML = '<p id="status">The reader could not start.<br><br>' +
      '<small>One of its script files did not load. If you are offline, reconnect once and ' +
      'reload; the app will then work offline again.</small></p>';
  }, 8000);
</script>
</body>
</html>
