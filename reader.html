<!doctype html>
<html lang="en" data-mode="review">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Tower of Ardenmoor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#efe9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15120d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ardenmoor">
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb;
    --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14);
    --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12);
    --ring:#9a6a3a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c;
      --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5);
      --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16); --ring:#d0a06a;
    }
  }
  :root[data-theme="light"]{ color-scheme:light; --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb; --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14); --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12); --ring:#9a6a3a; }
  :root[data-theme="dark"]{ color-scheme:dark; --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c; --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5); --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16); --ring:#d0a06a; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:var(--fs,20px); line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  /* focus ring for keyboard users */
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:8px}

  /* ---------- top progress + per-chapter ticks ---------- */
  #ticks{position:fixed;top:0;left:0;height:3px;width:100%;z-index:59;pointer-events:none}
  #ticks i{position:absolute;top:0;width:1px;height:3px;background:var(--muted);opacity:.5}
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}

  /* ---------- icons ---------- */
  .ic{width:1.2rem;height:1.2rem;display:block;flex:0 0 auto}
  .ic.sm{width:1.02rem;height:1.02rem}

  /* ---------- top bar (Menu · Mode · Settings) ---------- */
  header#bar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.4rem;
    padding:.45rem .6rem;padding-top:max(.45rem,env(safe-area-inset-top));
    background:var(--bar);border-bottom:1px solid var(--rule);
    backdrop-filter:saturate(1.2) blur(6px);
  }
  header#bar .spacer{flex:1}
  .iconbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:2.3rem;height:2.3rem;color:var(--fg);background:transparent;border:1px solid transparent;
    border-radius:10px;cursor:pointer;padding:0}
  .iconbtn:hover{background:var(--panel);border-color:var(--rule)}
  .pill{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:.82rem;
    padding:.34rem .8rem;border-radius:999px;border:1px solid var(--rule);background:var(--panel);
    color:var(--fg);cursor:pointer;line-height:1}
  .pill .ic{width:1.05rem;height:1.05rem}
  .pill:hover{border-color:var(--accent)}
  #noteCount{position:absolute;top:-.15rem;right:-.15rem;min-width:1.05rem;height:1.05rem;padding:0 .2rem;
    background:var(--accent);color:#fff;border-radius:999px;font-size:.62rem;line-height:1.05rem;text-align:center;display:none}
  #noteCount.show{display:block}
  /* review-only affordances hidden while reading */
  :root[data-mode="read"] #selTools,
  :root[data-mode="read"] #feedbackPanel{display:none !important}

  /* ---------- reading column ---------- */
  main{max-width:65ch;margin:0 auto;padding:2.5rem 1.4rem 7rem;padding-left:max(1.4rem,env(safe-area-inset-left));padding-right:max(1.4rem,env(safe-area-inset-right))}
  .titlepage{text-align:center;margin:2rem 0 5rem}
  .titlepage h1{font-size:2.5rem;font-weight:600;line-height:1.12;margin:0 0 .7rem;letter-spacing:.01em}
  .titlepage .book{font-variant:small-caps;letter-spacing:.28em;color:var(--muted);margin:0}
  section.chapter{margin-top:4.5rem;scroll-margin-top:3.4rem}
  section.chapter:first-of-type{margin-top:0}
  h2.chap{text-align:center;font-weight:600;font-size:1.35rem;line-height:1.3;margin:0 0 2.4rem}
  h2.chap .kicker{display:block;font-variant:small-caps;letter-spacing:.2em;font-size:.72rem;color:var(--muted);margin-bottom:.55rem}
  p{margin:0;text-indent:1.5em;text-align:justify;hyphens:auto;position:relative}
  p.flush{text-indent:0}
  .scene{margin:1.9rem 0;text-align:center;color:var(--muted);letter-spacing:.6em}
  .scene span{opacity:.6}

  /* commented paragraphs (review mode only) */
  p.hasNote::before{content:"";position:absolute;left:-.75rem;top:.12em;bottom:.12em;width:3px;border-radius:2px;background:var(--accent);opacity:.75}
  .noteDot{display:inline-block;cursor:pointer;margin-left:.35em;vertical-align:.05em;color:var(--accent);opacity:.85;text-indent:0}
  .noteDot:hover{opacity:1}
  .noteDot .ic{display:inline-block;width:.82em;height:.82em}
  /* revised paragraphs (track changes) */
  p.hasEdit::after{content:"";position:absolute;left:-.75rem;top:.12em;bottom:.12em;width:3px;border-radius:2px;background:var(--edit);opacity:.85}
  p.hasNote.hasEdit::after{left:-1.15rem}
  .editDot{display:inline-block;cursor:pointer;margin-left:.35em;vertical-align:.05em;color:var(--edit);opacity:.85;text-indent:0}
  .editDot:hover{opacity:1}
  .editDot .ic{display:inline-block;width:.82em;height:.82em}
  .diff-del{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px;opacity:.85}
  .diff-ins{color:var(--edit);background:var(--editbg);border-radius:3px;padding:0 .06em}
  p.isDeleted{opacity:.7}

  /* ---------- selection toolbar (Note · Edit · Bookmark) ---------- */
  #selTools{position:absolute;z-index:55;transform:translate(-50%,-118%);display:none;gap:.25rem;white-space:nowrap;
    background:var(--fg);border-radius:12px;padding:.22rem;box-shadow:0 6px 22px var(--shadow)}
  #selTools.show{display:flex}
  #selTools button{display:inline-flex;align-items:center;gap:.28rem;font:inherit;font-size:.78rem;cursor:pointer;
    border:0;border-radius:9px;padding:.34rem .55rem;background:transparent;color:var(--bg)}
  #selTools button:hover{background:rgba(255,255,255,.14)}
  #selTools .ic{width:.95rem;height:.95rem}
  #selTools:after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:var(--fg);border-bottom:0}

  /* ---------- composer / editor ---------- */
  .composer{margin:.35rem 0 1.1rem;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.6rem;text-indent:0}
  .composer .quote{font-size:.82em;color:var(--muted);font-style:italic;margin:0 0 .45rem;border-left:2px solid var(--rule);padding-left:.55rem}
  .composer textarea{display:block;width:100%;min-height:4.2rem;font:inherit;font-size:.9em;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:.5rem;resize:vertical}
  .composer .row{display:flex;gap:.4rem;margin-top:.5rem;align-items:center}
  .composer button{font:inherit;font-size:.82rem;cursor:pointer;border-radius:8px;padding:.35rem .75rem;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
  .composer button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .composer button.del{margin-left:auto;color:var(--danger);border-color:transparent;background:transparent}
  .composer.edit textarea{min-height:7rem;line-height:1.55}
  .composer.edit button.primary{background:var(--edit);border-color:var(--edit)}
  .composer .hint{font-size:.74rem;color:var(--muted);margin:.4rem 0 0;text-indent:0}

  /* ---------- bottom-sheet editor overlay ---------- */
  #sheetWrap{position:fixed;inset:0;z-index:85;pointer-events:none}
  #sheetWrap.open{pointer-events:auto}
  #sheetScrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s}
  #sheetWrap.open #sheetScrim{opacity:1}
  #sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:100%;max-width:40rem;
    background:var(--panel);border-top:1px solid var(--rule);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 34px var(--shadow);padding:.8rem 1rem calc(1rem + env(safe-area-inset-bottom));
    transform:translateY(112%);transition:transform .26s cubic-bezier(.22,.61,.36,1);max-height:82vh;overflow:auto}
  #sheetWrap.open #sheet{transform:none}
  #sheet:before{content:"";display:block;width:2.4rem;height:.28rem;border-radius:999px;background:var(--rule);margin:.1rem auto .7rem}
  #sheet .ctx{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 .55rem}
  #sheet .composer{margin:0;border:0;background:transparent;padding:0;text-indent:0}
  #sheet .composer textarea{min-height:5.5rem}
  #sheet .composer.edit textarea{min-height:8.5rem}

  /* ---------- scrim + drawer + settings popover ---------- */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
  #scrim.open{opacity:1;pointer-events:auto}
  aside#drawer{position:fixed;top:0;left:0;height:100%;width:min(23rem,88vw);z-index:71;background:var(--panel);
    border-right:1px solid var(--rule);box-shadow:0 0 40px var(--shadow);transition:transform .22s ease;
    overflow-y:auto;padding:0 0 2rem;transform:translateX(-102%)}
  aside#drawer.open{transform:none}
  .dhead{position:sticky;top:0;background:var(--panel);padding:1rem 1.2rem .7rem;border-bottom:1px solid var(--rule);z-index:1}
  .dhead .bktitle{font-size:1rem;font-weight:600;margin:0 0 .3rem}
  .dhead .pct{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
  .dhead .mini{height:3px;border-radius:2px;background:var(--rule);margin-top:.5rem;overflow:hidden}
  .dhead .mini i{display:block;height:100%;width:0;background:var(--accent)}
  .sect{padding:.4rem 0 .2rem}
  .sectLbl{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:.9rem 1.2rem .3rem}
  nav#tocNav a{display:block;padding:.5rem 1.2rem;color:var(--fg);text-decoration:none;font-size:.98rem;border-left:3px solid transparent}
  nav#tocNav a:hover{background:var(--bar)}
  nav#tocNav a.active{border-left-color:var(--accent);color:var(--accent);font-weight:600}
  .bmrow{display:flex;flex-direction:column;gap:.15rem;margin:.2rem 0}
  .bmrow button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;font:inherit;font-size:.92rem;
    color:var(--fg);background:transparent;border:0;cursor:pointer;padding:.5rem 1.2rem}
  .bmrow button:hover{background:var(--bar)}
  .bmrow button .ic{color:var(--accent)}
  .bmrow button[disabled]{color:var(--muted);cursor:default}
  .bmrow button[disabled] .ic{color:var(--muted)}

  #feedbackPanel{border-top:1px solid var(--rule);margin-top:.6rem;padding-top:.4rem}
  .tabs{display:flex;gap:.3rem;margin:.6rem 1.2rem 1rem}
  .tabs button{flex:1;font:inherit;font-size:.8rem;cursor:pointer;border-radius:8px;padding:.4rem;border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .tabs button.active{background:var(--panel);color:var(--fg);border-color:var(--accent);font-weight:600}
  .exportRow{display:flex;gap:.4rem;margin:0 1.2rem 1rem}
  .exportRow button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;font:inherit;font-size:.8rem;cursor:pointer;border-radius:8px;padding:.5rem;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
  .exportRow button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .exportRow .ic{width:1rem;height:1rem}
  .noteItem{padding:.7rem 1.2rem;border-top:1px solid var(--rule)}
  .noteItem .ch{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
  .noteItem .q{font-size:.82em;font-style:italic;color:var(--muted);margin:0 0 .3rem}
  .noteItem .t{font-size:.92em;white-space:pre-wrap}
  .noteItem .acts,.revItem .acts{display:flex;gap:.9rem;margin-top:.4rem}
  .noteItem .acts a,.revItem .acts a{font-size:.78rem;color:var(--accent);cursor:pointer;text-decoration:none}
  .noteItem .acts a.del,.revItem .acts a.del{color:var(--danger)}
  .revItem{padding:.7rem 1.2rem;border-top:1px solid var(--rule)}
  .revItem .ch{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
  .revItem .diff{font-size:.86em;line-height:1.5}
  .revItem .tag{display:inline-block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--edit);border:1px solid var(--edit);border-radius:5px;padding:.02rem .3rem;margin-bottom:.3rem}
  .revItem .tag.cut{color:var(--danger);border-color:var(--danger)}
  .resHead{margin:1.1rem 1.2rem .1rem;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:.85rem}
  .noteItem.resolved,.revItem.resolved{opacity:.6}
  .doneTag{display:inline-block;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--edit);border:1px solid var(--edit);border-radius:5px;padding:.02rem .32rem;vertical-align:.12em;margin-left:.3rem}
  .noteItem .acts a.res,.revItem .acts a.res{color:var(--edit)}
  .noteItem .acts a.reopen,.revItem .acts a.reopen{color:var(--muted)}
  .empty{color:var(--muted);padding:1rem 1.2rem;font-size:.9rem}

  /* settings popover */
  #settings{position:fixed;top:3.2rem;right:.6rem;z-index:72;width:min(17rem,92vw);background:var(--panel);
    border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 34px var(--shadow);padding:.7rem;
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .16s,transform .16s}
  #settings.open{opacity:1;transform:none;pointer-events:auto}
  .setRow{display:flex;align-items:center;gap:.5rem;padding:.35rem .2rem}
  .setRow .lbl{flex:1;font-size:.84rem;color:var(--muted)}
  .segbtn{display:inline-flex;align-items:center;justify-content:center;min-width:2.1rem;height:2.1rem;font:inherit;font-size:.86rem;
    cursor:pointer;border:1px solid var(--rule);background:var(--bg);color:var(--fg);border-radius:8px;padding:0 .5rem}
  .segbtn.active{border-color:var(--accent);color:var(--accent);font-weight:600}
  .seg{display:inline-flex;gap:.3rem}

  #settings select{font:inherit;font-size:.82rem;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:.3rem .35rem;max-width:9.6rem}
  .setLbl{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:.7rem .2rem .2rem;border-top:1px solid var(--rule);padding-top:.6rem}

  /* ---------- read-aloud (text-to-speech) player ---------- */
  #tts{position:fixed;left:max(.7rem,env(safe-area-inset-left));bottom:calc(1.1rem + env(safe-area-inset-bottom));z-index:78;
    display:flex;align-items:center;gap:.1rem;background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;box-shadow:0 6px 22px var(--shadow);padding:.22rem}
  #tts.hide{display:none}
  #tts button{display:inline-flex;align-items:center;justify-content:center;width:2.35rem;height:2.35rem;
    border:0;border-radius:999px;background:transparent;color:var(--fg);cursor:pointer;padding:0}
  #tts button:hover{background:var(--bg)}
  #tts button.main{background:var(--accent);color:#fff}
  #tts .rate{min-width:2.6rem;width:auto;font:inherit;font-size:.78rem;color:var(--muted)}
  #tts .rate:hover{color:var(--fg)}
  #tts .ic{width:1.15rem;height:1.15rem}
  #tts.collapsed .stop,#tts.collapsed .rate{display:none}
  .tts-on{background:rgba(154,106,58,.20);background:color-mix(in srgb, var(--accent) 24%, transparent);border-radius:4px;padding:0 .04em}

  #toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1.5rem);background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 6px 24px var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #status{max-width:38rem;margin:3rem auto;padding:0 1.4rem;color:var(--muted);text-align:center}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
</style>
</head>
<body>
<div id="ticks"></div>
<div id="progress"></div>

<header id="bar">
  <button id="btnMenu" class="iconbtn" aria-label="Open menu and contents"></button>
  <span class="spacer"></span>
  <button id="btnMode" class="pill" aria-label="Toggle read or review mode"></button>
  <span class="spacer"></span>
  <button id="btnSettings" class="iconbtn" aria-label="Settings"></button>
</header>

<div id="scrim"></div>

<aside id="drawer" aria-label="Contents and feedback">
  <div class="dhead">
    <p class="bktitle">The Tower of Ardenmoor</p>
    <div class="pct"><span id="bookPct">0</span>% through the book</div>
    <div class="mini"><i id="miniFill"></i></div>
  </div>
  <div class="sectLbl">Contents</div>
  <nav id="tocNav"></nav>
  <div class="sectLbl">Bookmark</div>
  <div class="bmrow">
    <button id="bmSet" aria-label="Bookmark the current spot"></button>
    <button id="bmGo" aria-label="Go to your bookmark"></button>
  </div>
  <section id="feedbackPanel" aria-label="Feedback and export">
    <div class="sectLbl">Feedback</div>
    <div class="tabs">
      <button id="tabNotes" class="active" data-pane="notes">Notes</button>
      <button id="tabEdits" data-pane="edits">Track changes</button>
    </div>
    <div class="exportRow">
      <button id="btnCopy" class="primary">Copy for Claude</button>
      <button id="btnDownload">Download .md</button>
    </div>
    <div class="exportRow" style="border-top:1px solid var(--rule);margin-top:.2rem;padding-top:.8rem">
      <button id="btnSync">Turn on cross-device sync</button>
    </div>
    <div id="notesList"></div>
    <div id="editsList" style="display:none"></div>
  </section>
</aside>

<div id="settings" role="dialog" aria-label="Settings">
  <div class="setRow"><span class="lbl">Text size</span>
    <div class="seg"><button id="btnSmaller" class="segbtn" aria-label="Smaller text"></button><button id="btnBigger" class="segbtn" aria-label="Larger text"></button></div>
  </div>
  <div class="setRow"><span class="lbl">Theme</span>
    <div class="seg">
      <button class="segbtn" data-theme-set="auto" aria-label="Automatic theme">Auto</button>
      <button class="segbtn" data-theme-set="light" aria-label="Light theme"></button>
      <button class="segbtn" data-theme-set="dark" aria-label="Dark theme"></button>
    </div>
  </div>
  <div id="ttsSettings">
    <div class="setLbl">Read aloud</div>
    <div class="setRow"><span class="lbl">Speed</span>
      <div class="seg">
        <button class="segbtn" data-rate="0.8" aria-label="Slow">0.8×</button>
        <button class="segbtn" data-rate="1" aria-label="Normal speed">1×</button>
        <button class="segbtn" data-rate="1.25" aria-label="Fast">1.25×</button>
      </div>
    </div>
    <div class="setRow"><span class="lbl">Voice</span>
      <select id="voiceSelect" aria-label="Reading voice"></select>
    </div>
  </div>
</div>

<div id="sheetWrap"><div id="sheetScrim"></div><div id="sheet" role="dialog" aria-modal="true" aria-label="Editor"></div></div>

<div id="selTools">
  <button id="btnAddNote" aria-label="Add a note on the selection"></button>
  <button id="btnAddEdit" aria-label="Rewrite the selected paragraph"></button>
  <button id="btnAddBookmark" aria-label="Bookmark the selected passage"></button>
</div>

<main id="book"><p id="status">Gathering the pages…</p></main>

<div id="tts" class="collapsed hide" aria-label="Read aloud">
  <button class="main" id="ttsPlay" aria-label="Read aloud from here"></button>
  <button class="stop" id="ttsStop" aria-label="Stop reading"></button>
  <button class="rate" id="ttsRate" aria-label="Reading speed">1×</button>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";
  var MANIFEST="manuscript/manifest.json", DIR="manuscript/";
  var KEY_PROGRESS="ardenmoor.progress.v1", KEY_BOOKMARK="ardenmoor.bookmark.v1",
      KEY_FS="ardenmoor.fontsize.v1", KEY_THEME="ardenmoor.theme.v1", KEY_NOTES="ardenmoor.comments.v1",
      KEY_REVS="ardenmoor.revisions.v1", KEY_SECRET="ardenmoor.sync.secret.v1",

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  /* display-only book typography: curly quotes + en/em dashes. Never touches dataset/export. */
  function typo(s){

      .replace(/---/g,"—").replace(/--/g,"–")
      .replace(/\.\.\./g,"…")
      .replace(/(^|[\s([{—–"])'/g,"$1‘")
      .replace(/'/g,"’")

  function parse(md){
    md=md.replace(/\r\n?/g,"\n");

    for(var i=0;i<raw.length;i++){

      if(b==="---"){ out.push({t:"scene"}); continue; }
      if(b.indexOf("### ")===0){ out.push({t:"chapter",text:b.slice(4).trim()}); continue; }
      if(b.indexOf("## ")===0||b.indexOf("# ")===0){ continue; }
      out.push({t:"p",text:b.replace(/\n+/g," ").trim()});
    }
    return out;
  }

  /* ---------- notes storage (unchanged data layer) ---------- */
  function getNotes(){ try{ return JSON.parse(localStorage.getItem(KEY_NOTES))||[]; }catch(e){ return []; } }

  function findNote(chap,s){ var a=getNotes(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s&&!a[i].resolved) return a[i]; } return null; }
  function upsertNote(chap,s,quote,text){

    setNotes(a);

  function deleteNote(chap,s){ setNotes(getNotes().filter(function(n){ return !(n.chap===chap&&n.snip===s); })); }
  function setNoteResolved(chap,s,val){ var a=getNotes(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].resolved=!!val; a[i].resolvedTs=val?Date.now():0; a[i].ts=Date.now(); } } setNotes(a); }
  function activeCount(arr){ var c=0; for(var i=0;i<arr.length;i++) if(!arr[i].resolved) c++; return c; }
  function updateCount(){ var n=activeCount(getNotes())+activeCount(getRevs()); noteCount.textContent=n; noteCount.classList.toggle("show", n>0); }

  /* ---------- revisions (track changes) storage (unchanged data layer) ---------- */
  function getRevs(){ try{ return JSON.parse(localStorage.getItem(KEY_REVS))||[]; }catch(e){ return []; } }

  function findRev(chap,s){ var a=getRevs(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s&&!a[i].resolved) return a[i]; } return null; }
  function upsertRev(chap,s,orig,revised){
    var a=getRevs(), found=false;
    for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].original=orig; a[i].revised=revised; a[i].ts=Date.now(); a[i].resolved=false; a[i].resolvedTs=0; a[i].resolvedVia=""; found=true; break; } }
    if(!found) a.push({chap:chap,snip:s,original:orig,revised:revised,ts:Date.now(),resolved:false});
    setRevs(a);
  }
  function deleteRev(chap,s){ setRevs(getRevs().filter(function(r){ return !(r.chap===chap&&r.snip===s); })); }
  function setRevResolved(chap,s,val,via){ var a=getRevs(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].resolved=!!val; a[i].resolvedTs=val?Date.now():0; a[i].resolvedVia=val?(via||"manual"):""; a[i].ts=Date.now(); } } setRevs(a); }

  /* ---------- verify tracked changes against the LIVE manuscript ---------- */
  function normText(s){ return (s||"").replace(/\s+/g," ").trim(); }
  function chapterLoaded(title){ for(var i=0;i<chapters.length;i++) if(chapters[i].title===title) return true; return false; }
  function origStillPresent(chap,orig){
    var target=normText(orig), ps=book.querySelectorAll("p[data-snip]");
    for(var i=0;i<ps.length;i++){ if(ps[i].dataset.chap===chap && normText(ps[i].dataset.text)===target) return true; }
    return false;
  }
  function autoVerifyRevs(){
    if(!chapters.length) return false;
    var a=getRevs(), changed=false;
    for(var i=0;i<a.length;i++){
      var r=a[i];
      if(r.resolved) continue;
      if(!chapterLoaded(r.chap)) continue;
      if(!origStillPresent(r.chap, r.original)){ r.resolved=true; r.resolvedTs=Date.now(); r.resolvedVia="applied"; r.ts=Date.now(); changed=true; }
    }
    if(changed) setRevs(a);
    return changed;
  }

  /* ---------- word-level diff (unchanged) ---------- */
  function tok(s){ return s.replace(/\s+/g," ").trim().split(" ").filter(function(x){ return x!==""; }); }
  function diffWords(a,b){
    var A=tok(a), B=tok(b), n=A.length, m=B.length, i, j;
    var dp=[]; for(i=0;i<=n;i++){ var row=[]; for(j=0;j<=m;j++) row.push(0); dp.push(row); }
    for(i=n-1;i>=0;i--) for(j=m-1;j>=0;j--) dp[i][j]= A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
    var out=[]; i=0; j=0;
    while(i<n&&j<m){
      if(A[i]===B[j]){ out.push({t:"eq",s:A[i]}); i++; j++; }
      else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:"del",s:A[i]}); i++; }
      else { out.push({t:"ins",s:B[j]}); j++; }
    }
    while(i<n){ out.push({t:"del",s:A[i]}); i++; }
    while(j<m){ out.push({t:"ins",s:B[j]}); j++; }
    return out;
  }
  function diffHTML(orig,revised){
    if(!revised||!revised.trim()) return "<span class=\"diff-del\">"+esc(orig.replace(/\s+/g," ").trim())+"</span>";
    var parts=diffWords(orig,revised), html="";
    for(var k=0;k<parts.length;k++){
      var pre=k>0?" ":"", p=parts[k];
      if(p.t==="eq") html+=pre+esc(p.s);
      else if(p.t==="del") html+=pre+"<span class=\"diff-del\">"+esc(p.s)+"</span>";
      else html+=pre+"<span class=\"diff-ins\">"+esc(p.s)+"</span>";
    }
    return html;
  }

  /* ---------- cross-device sync (unchanged) ---------- */
  var SYNC={
    secret:(function(){ try{ return localStorage.getItem(KEY_SECRET)||""; }catch(e){ return ""; } })(),
    on:false, _t:null, _tr:null,
    _h:function(){ return {"Content-Type":"application/json","x-feedback-secret":SYNC.secret}; },
    setSecret:function(s){ SYNC.secret=s; try{ localStorage.setItem(KEY_SECRET,s); }catch(e){} },
    pull:function(){
      if(!SYNC.secret) return Promise.resolve(null);
      return fetch("api/sync",{headers:SYNC._h(),cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("sync "+r.status); return r.json(); })
        .then(function(j){ SYNC.on=!!(j&&j.ok); return j; })

    },
    pushNotes:function(){
      if(!SYNC.secret) return;

        fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({notes:getNotes()})})
          .then(function(r){ SYNC.on=r.ok; }).catch(function(){ SYNC.on=false; });
      },800);
    },
    pushRevs:function(){
      if(!SYNC.secret) return;
      clearTimeout(SYNC._tr);
      SYNC._tr=setTimeout(function(){
        fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({revisions:getRevs()})})
          .then(function(r){ SYNC.on=r.ok; }).catch(function(){ SYNC.on=false; });
      },800);
    },
    pushBookmark:function(bm){
      if(!SYNC.secret) return;
      fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({bookmark:bm})}).catch(function(){});
    },
    init:function(){
      return SYNC.pull().then(function(j){
        if(j&&j.ok){
          var map={};
          getNotes().concat(j.notes||[]).forEach(function(n){ var k=(n.chap||"")+"|"+(n.snip||""); if(!map[k]||(n.ts||0)>(map[k].ts||0)) map[k]=n; });
          setNotes(Object.keys(map).map(function(k){ return map[k]; }));
          var rmap={};
          getRevs().concat(j.revisions||[]).forEach(function(r){ var k=(r.chap||"")+"|"+(r.snip||""); if(!rmap[k]||(r.ts||0)>(rmap[k].ts||0)) rmap[k]=r; });
          setRevs(Object.keys(rmap).map(function(k){ return rmap[k]; }));

  var chapters=[]; // {id,title,el}

  function render(texts){
    book.innerHTML="";
    var tp=document.createElement("div"); tp.className="titlepage";
    tp.innerHTML="<h1>The Tower of Ardenmoor</h1><p class=\"book\">Book One</p>";
    book.appendChild(tp);
    chapters=[];
    for(var i=0;i<texts.length;i++){
      var blocks=parse(texts[i]);
      var sec=document.createElement("section"); sec.className="chapter"; sec.id="ch-"+i;
      var title="", flush=true;
      for(var j=0;j<blocks.length;j++){
        var bl=blocks[j];
        if(bl.t==="chapter"){
          title=bl.text;
          var parts=bl.text.split(":"), h=document.createElement("h2"); h.className="chap";
          if(parts.length>1){ h.innerHTML="<span class=\"kicker\">"+esc(parts[0].trim())+"</span>"+esc(parts.slice(1).join(":").trim()); }
          else h.textContent=bl.text;
          sec.appendChild(h); flush=true;
        } else if(bl.t==="scene"){
          var d=document.createElement("div"); d.className="scene"; d.innerHTML="<span>&#10022;</span>"; sec.appendChild(d); flush=true;
        } else {
          var p=document.createElement("p"); if(flush){ p.className="flush"; flush=false; }
          p.innerHTML=inline(bl.text);
          p.dataset.chap=title; p.dataset.snip=snip(bl.text); p.dataset.text=bl.text;
          sec.appendChild(p);
        }
      }
      book.appendChild(sec);
      chapters.push({id:sec.id,title:title||("Part "+(i+1)),el:sec});
    }
    decorate(); buildToc(); updateCount(); layoutTicks();
    if(autoVerifyRevs()) decorate();
  }

  /* ---------- decorate: clean text in read mode; diff + markers in review mode ---------- */
  function decorate(){
    var readMode=(mode==="read");
    var ps=book.querySelectorAll("p[data-snip]");
    ps.forEach(function(p){
      var chap=p.dataset.chap, s=p.dataset.snip, orig=p.dataset.text||"";
      if(readMode){ p.classList.remove("hasNote","hasEdit","isDeleted"); p.innerHTML=inline(orig); return; }
      var rev=findRev(chap,s), note=findNote(chap,s);
      if(rev){
        p.classList.add("hasEdit");
        p.classList.toggle("isDeleted", !(rev.revised&&rev.revised.trim()));
        p.innerHTML=diffHTML(orig, rev.revised);
      } else {
        p.classList.remove("hasEdit","isDeleted");
        p.innerHTML=inline(orig);
      }
      p.classList.toggle("hasNote", !!note);
      if(note){
        var nd=document.createElement("span"); nd.className="noteDot"; nd.innerHTML=svg("note"); nd.title="View / edit note";
        nd.addEventListener("click", function(){ openComposer(p, note.quote); });
        p.appendChild(nd);
      }
      if(rev){
        var ed=document.createElement("span"); ed.className="editDot"; ed.innerHTML=svg("pen"); ed.title="Edit / revert this revision";
        ed.addEventListener("click", function(){ openEditor(p); });
        p.appendChild(ed);
      }
    });
  }

  /* ---------- bottom-sheet overlay host for the composer/editor ---------- */
  var sheetWrap=document.getElementById("sheetWrap"), sheetEl=document.getElementById("sheet"),
      sheetScrim=document.getElementById("sheetScrim"), vv=window.visualViewport;
  function positionSheet(){

    var kb=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)); // keyboard height
    sheetEl.style.bottom=kb+"px";

  function openSheet(ctxLabel, inner){

    sheetEl.appendChild(inner);

    sheetWrap.classList.remove("open");

  /* ---------- composer (same data logic; presented in the bottom sheet) ---------- */
  function ctxOf(p){ var t=(p.dataset.text||"").replace(/\s+/g," ").trim(); return (p.dataset.chap||"")+" · “"+t.slice(0,42)+(t.length>42?"…":"")+"”"; }
  function openComposer(p, quote){
    closeComposers();
    var chap=p.dataset.chap, s=p.dataset.snip, existing=findNote(chap,s);
    var q=(existing&&existing.quote)||quote||"";
    var box=document.createElement("div"); box.className="composer";
    box.innerHTML=(q?("<p class=\"quote\">"+esc(q.length>220?q.slice(0,220)+"…":q)+"</p>"):"")+
      "<textarea placeholder=\"Your note or feedback about this passage…\"></textarea>"+
      "<div class=\"row\"><button class=\"primary save\">Save note</button><button class=\"cancel\">Cancel</button>"+
      (existing?"<button class=\"del\">Delete</button>":"")+"</div>";
    openSheet(ctxOf(p), box);
    var ta=box.querySelector("textarea"); ta.value=existing?existing.text:""; ta.focus();
    box.querySelector(".save").addEventListener("click", function(){
      var v=ta.value.trim(); if(!v){ toast("Nothing to save"); return; }
      upsertNote(chap,s,q,v); decorate(); buildNotesList(); closeSheet(); toast("Note saved");
    });
    box.querySelector(".cancel").addEventListener("click", closeSheet);
    var del=box.querySelector(".del");
    if(del) del.addEventListener("click", function(){ deleteNote(chap,s); decorate(); buildNotesList(); closeSheet(); toast("Note deleted"); });
  }

  /* ---------- track-changes editor (unchanged logic) ---------- */
  function openEditor(p){
    closeComposers();
    var chap=p.dataset.chap, s=p.dataset.snip, orig=p.dataset.text||"", existing=findRev(chap,s);
    var box=document.createElement("div"); box.className="composer edit";
    box.innerHTML="<p class=\"quote\">Rewrite this paragraph as you want it to read. To cut the passage entirely, clear the box and save.</p>"+
      "<textarea spellcheck=\"true\"></textarea>"+
      "<p class=\"hint\">Saved as a tracked change; the original stays until you or I apply it.</p>"+
      "<div class=\"row\"><button class=\"primary save\">Save revision</button><button class=\"cancel\">Cancel</button>"+
      (existing?"<button class=\"del\">Revert</button>":"")+"</div>";
    openSheet(ctxOf(p), box);
    var ta=box.querySelector("textarea"); ta.value=existing?existing.revised:orig; ta.focus();
    box.querySelector(".save").addEventListener("click", function(){
      var v=ta.value.replace(/\s+$/,"");
      if(v.trim()===orig.trim()){ if(existing){ deleteRev(chap,s); decorate(); buildEditsList(); } closeSheet(); toast("No change from the original"); return; }
      upsertRev(chap,s,orig,v); decorate(); buildEditsList(); closeSheet();
      toast(v.trim()?"Revision saved":"Marked for deletion");
    });
    box.querySelector(".cancel").addEventListener("click", closeSheet);
    var del=box.querySelector(".del");
    if(del) del.addEventListener("click", function(){ deleteRev(chap,s); decorate(); buildEditsList(); closeSheet(); toast("Reverted to original"); });
  }

  /* ---------- selection -> floating toolbar (review mode only) ---------- */
  function paragraphOfSelection(){
    var sel=window.getSelection(); if(!sel||sel.rangeCount===0||sel.isCollapsed) return null;
    var node=sel.getRangeAt(0).commonAncestorContainer;
    var el=node.nodeType===1?node:node.parentElement;
    while(el&&el!==book){ if(el.tagName==="P"&&el.dataset.snip!==undefined) return el; el=el.parentElement; }
    return null;
  }
  var pendingSel=null;
  function onSelect(){
    if(mode!=="review"){ selTools.classList.remove("show"); pendingSel=null; return; }
    var p=paragraphOfSelection();
    var sel=window.getSelection();
    if(!p){ selTools.classList.remove("show"); pendingSel=null; return; }
    var rect=sel.getRangeAt(0).getBoundingClientRect();
    pendingSel={ p:p, quote:sel.toString().replace(/\s+/g," ").trim() };
    var x=window.scrollX+rect.left+rect.width/2;
    x=Math.max(window.scrollX+70, Math.min(x, window.scrollX+window.innerWidth-70));
    selTools.style.left=x+"px";
    selTools.style.top=(window.scrollY+rect.top)+"px";
    selTools.classList.add("show");
  }
  document.addEventListener("mouseup", function(){ setTimeout(onSelect,10); });
  document.addEventListener("touchend", function(){ setTimeout(onSelect,10); });
  selTools.addEventListener("mousedown", function(e){ e.preventDefault(); });
  function consumeSel(){ var p=pendingSel?pendingSel.p:null, q=pendingSel?pendingSel.quote:""; selTools.classList.remove("show"); if(window.getSelection) window.getSelection().removeAllRanges(); return {p:p,q:q}; }
  document.getElementById("btnAddNote").innerHTML=svg("note")+"<span>Note</span>";
  document.getElementById("btnAddEdit").innerHTML=svg("pen")+"<span>Edit</span>";
  document.getElementById("btnAddBookmark").innerHTML=svg("bookmark")+"<span>Mark</span>";

  /* ---------- export (byte-for-byte identical output) ---------- */
  function chapIndex(){ var order={}; chapters.forEach(function(c,i){ order[c.title]=i; }); return order; }
  function bySortedChap(items){
    var order=chapIndex();
    return items.slice().sort(function(a,b){ var d=(order[a.chap]==null?99:order[a.chap])-(order[b.chap]==null?99:order[b.chap]); return d!==0?d:(a.ts||0)-(b.ts||0); });
  }
  function exportMarkdown(){
    var notes=getNotes().filter(function(n){ return !n.resolved; }),
        revs=getRevs().filter(function(r){ return !r.resolved; });
    if(!notes.length&&!revs.length) return "";
    var out="# Reader feedback: The Tower of Ardenmoor\n\n";
    out+="Exported "+new Date().toISOString().slice(0,10)+". "+
      notes.length+" note"+(notes.length===1?"":"s")+", "+
      revs.length+" tracked change"+(revs.length===1?"":"s")+".\n";

    if(notes.length){
      out+="\n# Notes\n";
      var byChap={}, order=[];
      bySortedChap(notes).forEach(function(n){ if(!byChap[n.chap]){ byChap[n.chap]=[]; order.push(n.chap); } byChap[n.chap].push(n); });
      order.forEach(function(t){
        out+="\n## "+t+"\n\n";
        byChap[t].forEach(function(n){
          if(n.quote) out+="> "+n.quote+"\n\n";
          else out+="> (near: \""+n.snip+"…\")\n\n";
          out+=n.text+"\n\n";
        });
      });
    }

    if(revs.length){
      out+="\n# Tracked changes\n";
      out+="\nApply these edits to the manuscript. \"Delete this paragraph\" means remove it entirely.\n";
      var rByChap={}, rOrder=[];
      bySortedChap(revs).forEach(function(r){ if(!rByChap[r.chap]){ rByChap[r.chap]=[]; rOrder.push(r.chap); } rByChap[r.chap].push(r); });
      rOrder.forEach(function(t){
        out+="\n## "+t+"\n\n";
        rByChap[t].forEach(function(r){
          out+="ORIGINAL:\n> "+r.original.replace(/\s+/g," ").trim()+"\n\n";
          if(r.revised&&r.revised.trim()) out+="REVISED:\n> "+r.revised.replace(/\s+/g," ").trim()+"\n\n";
          else out+="REVISED: (delete this paragraph)\n\n";
        });
      });
    }
    return out.trim()+"\n";
  }
  function download(name, text){

    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },0);
  }

        div.querySelector(".del").addEventListener("click", function(){ deleteRev(r.chap,r.snip); decorate(); buildEditsList(); });

  function posOfParagraph(p){

  /* ---------- read-aloud (Web Speech; on-device, works offline) ---------- */
  var TTS=(function(){
    var supported=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
    var el=document.getElementById("tts"), btnPlay=document.getElementById("ttsPlay"),
        btnStop=document.getElementById("ttsStop"), btnRate=document.getElementById("ttsRate"),
        voiceSel=document.getElementById("voiceSelect");
    var RATES=[0.8,0.9,1,1.1,1.25,1.5];
    var rate=parseFloat(localStorage.getItem(KEY_RATE))||1;
    var voiceURI=localStorage.getItem(KEY_VOICE)||"";
    var voices=[], voice=null, queue=[], qi=0, playing=false, paused=false, curP=null, keep=null;
    if(!supported){ if(el) el.classList.add("hide"); var ts=document.getElementById("ttsSettings"); if(ts) ts.style.display="none"; return {supported:false}; }
    el.classList.remove("hide");

    function loadVoices(){
      var all=window.speechSynthesis.getVoices()||[];
      voices=all.filter(function(v){ return /^en(-|_|$)/i.test(v.lang); }); if(!voices.length) voices=all;
      voice=voices.filter(function(v){ return v.voiceURI===voiceURI; })[0]
          || voices.filter(function(v){ return v.localService&&/^en/i.test(v.lang); })[0]
          || voices.filter(function(v){ return /^en/i.test(v.lang); })[0] || voices[0] || null;
      if(voiceSel){
        voiceSel.innerHTML="";
        voices.forEach(function(v){ var o=document.createElement("option"); o.value=v.voiceURI; o.textContent=v.name.replace(/\s*\(.*\)$/,"")+(v.localService?"":" (online)"); if(voice&&v.voiceURI===voice.voiceURI) o.selected=true; voiceSel.appendChild(o); });
      }
    }
    loadVoices();
    try{ window.speechSynthesis.onvoiceschanged=loadVoices; }catch(e){}
    if(voiceSel) voiceSel.addEventListener("change", function(){ voiceURI=voiceSel.value; try{localStorage.setItem(KEY_VOICE,voiceURI);}catch(e){} voice=voices.filter(function(v){return v.voiceURI===voiceURI;})[0]||voice; });

    function splitSentences(text){ var m=text.match(/[^.!?…]+[.!?…]+["'”’)\]]*\s*|[^.!?…]+\s*$/g); return (m&&m.length)?m:[text]; }
    function build(){
      queue=[]; curP=null;
      var ps=Array.prototype.slice.call(book.querySelectorAll("p[data-snip]")), start=0;
      for(var i=0;i<ps.length;i++){ if(ps[i].getBoundingClientRect().bottom>62){ start=i; break; } if(i===ps.length-1) start=i; }
      for(var k=start;k<ps.length;k++){ var p=ps[k], sents=splitSentences(p.dataset.text||""); for(var s=0;s<sents.length;s++){ if(sents[s].trim()) queue.push({p:p,sents:sents,si:s}); } }
    }
    function paint(item){
      if(curP&&curP!==item.p) curP.innerHTML=inline(curP.dataset.text||"");
      curP=item.p; var html="";
      for(var i=0;i<item.sents.length;i++){ html += (i===item.si)?('<span class="tts-on">'+inline(item.sents[i])+'</span>'):inline(item.sents[i]); }
      item.p.innerHTML=html;
      var r=item.p.getBoundingClientRect(); if(r.top<62||r.bottom>window.innerHeight-24) item.p.scrollIntoView({block:"center"});
    }
    function clearPaint(){ if(curP){ curP.innerHTML=inline(curP.dataset.text||""); curP=null; } }
    function speakNext(){
      if(!playing) return;
      if(qi>=queue.length){ stop(); return; }
      var item=queue[qi]; paint(item);
      var u=new SpeechSynthesisUtterance(item.sents[item.si].replace(/\s+/g," ").trim());
      if(voice) u.voice=voice; u.rate=rate; u.pitch=1;
      u.onend=function(){ if(playing&&!paused){ qi++; speakNext(); } };
      u.onerror=function(){ if(playing&&!paused){ qi++; speakNext(); } };
      window.speechSynthesis.speak(u);
    }
    function ui(){
      el.classList.toggle("collapsed", !playing);
      btnPlay.innerHTML=(playing&&!paused)?svg("pause"):(playing?svg("play"):svg("headphones"));
      btnStop.innerHTML=svg("square"); btnRate.textContent=rate+"×";
    }
    function keepAlive(){ stopKeep(); keep=setInterval(function(){ if(playing&&!paused&&window.speechSynthesis.speaking) window.speechSynthesis.resume(); },9000); }
    function stopKeep(){ if(keep){ clearInterval(keep); keep=null; } }
    function media(){
      if(!("mediaSession" in navigator)) return;
      try{ navigator.mediaSession.metadata=new MediaMetadata({title:"The Tower of Ardenmoor",artist:"Read aloud",album:"Book One"});
        navigator.mediaSession.setActionHandler("play", function(){ paused?resume():start(); });
        navigator.mediaSession.setActionHandler("pause", pause);
        navigator.mediaSession.setActionHandler("stop", stop);
      }catch(e){}
    }
    function pbState(s){ if("mediaSession" in navigator) try{ navigator.mediaSession.playbackState=s; }catch(e){} }
    function start(){ window.speechSynthesis.cancel(); build(); if(!queue.length){ toast("Nothing to read here"); return; } playing=true; paused=false; qi=0; ui(); keepAlive(); media(); pbState("playing"); speakNext(); }
    function pause(){ if(!playing) return; paused=true; window.speechSynthesis.pause(); ui(); pbState("paused"); }
    function resume(){ if(!playing) return; paused=false; window.speechSynthesis.resume(); ui(); pbState("playing"); }
    function toggle(){ if(!playing) start(); else if(paused) resume(); else pause(); }
    function stop(){ playing=false; paused=false; window.speechSynthesis.cancel(); stopKeep(); clearPaint(); ui(); if(typeof decorate==="function") decorate(); pbState("none"); }

    btnPlay.addEventListener("click", toggle);
    btnStop.addEventListener("click", stop);
    function syncRateBtns(){ Array.prototype.forEach.call(document.querySelectorAll("[data-rate]"), function(b){ b.classList.toggle("active", parseFloat(b.getAttribute("data-rate"))===rate); }); }
    btnRate.addEventListener("click", function(){ var i=RATES.indexOf(rate); if(i<0)i=2; rate=RATES[(i+1)%RATES.length]; try{localStorage.setItem(KEY_RATE,rate);}catch(e){} syncRateBtns(); ui(); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-rate]"), function(b){ b.addEventListener("click", function(){ rate=parseFloat(b.getAttribute("data-rate")); try{localStorage.setItem(KEY_RATE,rate);}catch(e){} syncRateBtns(); ui(); }); });
    syncRateBtns(); ui();
    window.addEventListener("beforeunload", function(){ try{ window.speechSynthesis.cancel(); }catch(e){} });
    return {supported:true, stop:stop};
  })();

  /* ---------- offline PWA: register the service worker ---------- */
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }

  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", function(){ onScroll(); layoutTicks(); });

  fetchText(MANIFEST).then(function(txt){
    var files=JSON.parse(txt);
    return Promise.all(files.map(function(f){ return fetchText(DIR+f); }));
  }).then(function(texts){
    render(texts);
    if(location.hash&&document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
    else { var p=loadPos(KEY_PROGRESS); if(p) setTimeout(function(){ gotoPos(p); layoutTicks(); },30); }
    onScroll();
    SYNC.init();
  }).catch(function(err){
    book.innerHTML="<p id=\"status\">Could not load the manuscript.<br><br><small>"+esc(String(err&&err.message||err))+
      "</small><br><br>This reader loads the Markdown live, so open it from a web host (Vercel, GitHub Pages) or a local server, not a <code>file://</code> path.</p>";
  });
})();
</script>
</body>
</html>
