<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower of Ardenmoor</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb;
    --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c;
      --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:var(--fs,20px); line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }
  /* progress + toolbar */
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
  header#bar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.4rem;
    padding:.5rem .8rem;background:var(--bar);border-bottom:1px solid var(--rule);
    backdrop-filter:saturate(1.2) blur(6px);
  }
  header#bar .title{font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header#bar button{
    font:inherit;font-size:.95rem;line-height:1;cursor:pointer;color:var(--fg);
    background:transparent;border:1px solid transparent;border-radius:8px;padding:.35rem .5rem;
  }
  header#bar button:hover{background:var(--panel);border-color:var(--rule)}
  header#bar .sep{width:1px;height:1.3rem;background:var(--rule);margin:0 .15rem}
  /* article */
  main{max-width:38rem;margin:0 auto;padding:2.5rem 1.4rem 7rem}
  .titlepage{text-align:center;margin:2rem 0 5rem}
  .titlepage h1{font-size:2.5rem;font-weight:600;line-height:1.12;margin:0 0 .7rem;letter-spacing:.01em}
  .titlepage .book{font-variant:small-caps;letter-spacing:.28em;color:var(--muted);margin:0}
  .titlepage .by{margin:1.6rem 0 0;color:var(--muted);font-style:italic}
  section.chapter{margin-top:4.5rem}
  section.chapter:first-of-type{margin-top:0}
  h2.chap{text-align:center;font-weight:600;font-size:1.35rem;line-height:1.3;margin:0 0 2.4rem}
  h2.chap .kicker{display:block;font-variant:small-caps;letter-spacing:.2em;font-size:.72rem;color:var(--muted);margin-bottom:.55rem}
  p{margin:0;text-indent:1.5em;text-align:justify;hyphens:auto}
  p.flush{text-indent:0}
  p.flush::first-letter{}
  .scene{margin:1.9rem 0;text-align:center;color:var(--muted);letter-spacing:.6em}
  .scene span{opacity:.6}
  /* TOC drawer */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
  #scrim.open{opacity:1;pointer-events:auto}
  aside#toc{
    position:fixed;top:0;left:0;height:100%;width:min(20rem,82vw);z-index:71;
    background:var(--panel);border-right:1px solid var(--rule);box-shadow:0 0 40px var(--shadow);
    transform:translateX(-102%);transition:transform .22s ease;overflow-y:auto;padding:1.1rem 0 2rem;
  }
  aside#toc.open{transform:none}
  aside#toc h3{margin:.3rem 1.2rem 1rem;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  aside#toc a{display:block;padding:.55rem 1.2rem;color:var(--fg);text-decoration:none;font-size:.98rem;border-left:3px solid transparent}
  aside#toc a:hover{background:var(--bar)}
  aside#toc a.active{border-left-color:var(--accent);color:var(--accent);font-weight:600}
  aside#toc .bm{margin:.6rem 1.2rem 0;padding-top:.9rem;border-top:1px solid var(--rule)}
  aside#toc .bm a{padding-left:0;border:0}
  /* toast */
  #toast{
    position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1.5rem);
    background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 6px 24px var(--shadow)
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #status{max-width:38rem;margin:3rem auto;padding:0 1.4rem;color:var(--muted);text-align:center}
  a.textlink{color:var(--accent)}
</style>
</head>
<body>
<div id="progress"></div>

<header id="bar">
  <button id="btnToc" title="Contents" aria-label="Contents">☰</button>
  <span class="title">The Tower of Ardenmoor</span>
  <button id="btnMark" title="Bookmark this spot">🔖</button>
  <button id="btnGoto" title="Go to bookmark">↦</button>
  <span class="sep"></span>
  <button id="btnSmaller" title="Smaller text">A−</button>
  <button id="btnBigger" title="Larger text">A+</button>
  <button id="btnTheme" title="Light / dark">◐</button>
</header>

<div id="scrim"></div>
<aside id="toc"><h3>Contents</h3><nav id="tocNav"></nav></aside>

<main id="book"><p id="status">Gathering the pages…</p></main>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  var MANIFEST = "manuscript/manifest.json";
  var DIR = "manuscript/";
  var KEY_PROGRESS = "ardenmoor.progress.v1";
  var KEY_BOOKMARK = "ardenmoor.bookmark.v1";
  var KEY_FS = "ardenmoor.fontsize.v1";
  var KEY_THEME = "ardenmoor.theme.v1";

  var book = document.getElementById("book");
  var tocNav = document.getElementById("tocNav");
  var toastEl = document.getElementById("toast");
  var progressEl = document.getElementById("progress");

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function inline(s){ return esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>"); }

  // Minimal markdown -> structured blocks for THIS manuscript's simple format.
  function parse(md){
    md = md.replace(/\r\n?/g,"\n");
    var raw = md.split(/\n{2,}/);
    var blocks = [];
    for(var i=0;i<raw.length;i++){
      var b = raw[i].trim();
      if(!b) continue;
      if(b === "---"){ blocks.push({t:"scene"}); continue; }
      if(b.indexOf("### ")===0){ blocks.push({t:"chapter", text:b.slice(4).trim()}); continue; }
      if(b.indexOf("## ")===0){ continue; }   // "Book One" dedup
      if(b.indexOf("# ")===0){ continue; }     // book title dedup
      blocks.push({t:"p", text:b.replace(/\n+/g," ").trim()});
    }
    return blocks;
  }

  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
  }

  function bust(url){ return url + (url.indexOf("?")<0?"?":"&") + "v=" + Date.now(); }

  function fetchText(url){
    return fetch(bust(url), {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error(url + " (" + r.status + ")");
      return r.text();
    });
  }

  var chapters = []; // {id, title, el}

  function render(files, texts){
    book.innerHTML = "";
    var tp = document.createElement("div");
    tp.className = "titlepage";
    tp.innerHTML = "<h1>The Tower of Ardenmoor</h1><p class=\"book\">Book One</p>";
    book.appendChild(tp);

    chapters = [];
    for(var i=0;i<texts.length;i++){
      var blocks = parse(texts[i]);
      var sec = document.createElement("section");
      sec.className = "chapter";
      sec.id = "ch-" + i;
      var title = "";
      var flushNext = true; // first paragraph after a heading/scene break is flush-left
      for(var j=0;j<blocks.length;j++){
        var bl = blocks[j];
        if(bl.t === "chapter"){
          title = bl.text;
          var parts = bl.text.split(":");
          var h = document.createElement("h2");
          h.className = "chap";
          if(parts.length>1){
            h.innerHTML = "<span class=\"kicker\">"+esc(parts[0].trim())+"</span>"+esc(parts.slice(1).join(":").trim());
          } else {
            h.textContent = bl.text;
          }
          sec.appendChild(h);
          flushNext = true;
        } else if(bl.t === "scene"){
          var d = document.createElement("div");
          d.className = "scene"; d.innerHTML = "<span>&#10022;</span>";
          sec.appendChild(d);
          flushNext = true;
        } else {
          var p = document.createElement("p");
          if(flushNext){ p.className = "flush"; flushNext = false; }
          p.innerHTML = inline(bl.text);
          sec.appendChild(p);
        }
      }
      book.appendChild(sec);
      chapters.push({ id: sec.id, title: title || ("Part " + (i+1)), el: sec });
    }
    buildToc();
  }

  function buildToc(){
    tocNav.innerHTML = "";
    chapters.forEach(function(c){
      var a = document.createElement("a");
      a.href = "#" + c.id;
      a.dataset.id = c.id;
      var t = c.title.replace(/^Chapter\s+[^:]*:\s*/i,"");
      var label = c.title.match(/^(Prologue)/i) ? c.title
                 : (c.title.match(/^Chapter\s+([^:]*)/i) ? ("Ch " + RegExp.$1.trim() + (t?": "+t:"")) : c.title);
      a.textContent = label;
      a.addEventListener("click", function(){ closeToc(); });
      tocNav.appendChild(a);
    });
    var bm = loadPos(KEY_BOOKMARK);
    if(bm){
      var wrap = document.createElement("div"); wrap.className="bm";
      var a = document.createElement("a"); a.href="#"; a.className="textlink";
      a.textContent = "🔖 Go to your bookmark";
      a.addEventListener("click", function(e){ e.preventDefault(); gotoPos(bm); closeToc(); });
      wrap.appendChild(a); tocNav.appendChild(wrap);
    }
  }

  // position = {id, offset}
  function currentPos(){
    var y = window.scrollY + 4;
    var chosen = chapters.length ? chapters[0] : null;
    for(var i=0;i<chapters.length;i++){
      if(chapters[i].el.offsetTop <= y) chosen = chapters[i]; else break;
    }
    if(!chosen) return {id:null, offset:window.scrollY};
    return { id: chosen.id, offset: Math.round(window.scrollY - chosen.el.offsetTop) };
  }
  function gotoPos(pos){
    if(!pos) return;
    var el = pos.id && document.getElementById(pos.id);
    var top = (el ? el.offsetTop : 0) + (pos.offset||0);
    window.scrollTo(0, Math.max(0, top));
  }
  function savePos(key,pos){ try{ localStorage.setItem(key, JSON.stringify(pos)); }catch(e){} }
  function loadPos(key){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } }

  // progress bar + active TOC + autosave
  var ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      progressEl.style.width = (h>0 ? (window.scrollY/h*100) : 0) + "%";
      var pos = currentPos();
      var links = tocNav.querySelectorAll("a[data-id]");
      links.forEach(function(l){ l.classList.toggle("active", l.dataset.id===pos.id); });
      clearTimeout(onScroll._t);
      onScroll._t = setTimeout(function(){ savePos(KEY_PROGRESS, pos); }, 400);
      ticking=false;
    });
  }

  // TOC open/close
  var toc=document.getElementById("toc"), scrim=document.getElementById("scrim");
  function openToc(){ toc.classList.add("open"); scrim.classList.add("open"); }
  function closeToc(){ toc.classList.remove("open"); scrim.classList.remove("open"); }
  document.getElementById("btnToc").addEventListener("click", function(){ toc.classList.contains("open")?closeToc():openToc(); });
  scrim.addEventListener("click", closeToc);

  // bookmark buttons
  document.getElementById("btnMark").addEventListener("click", function(){
    var pos = currentPos(); savePos(KEY_BOOKMARK, pos); buildToc(); toast("Bookmarked this spot");
  });
  document.getElementById("btnGoto").addEventListener("click", function(){
    var bm = loadPos(KEY_BOOKMARK);
    if(bm){ gotoPos(bm); toast("Jumped to your bookmark"); } else { toast("No bookmark yet — tap 🔖 to set one"); }
  });

  // font size
  var fs = parseInt(loadPos(KEY_FS)||0,10) || 20;
  function applyFs(){ document.body.style.setProperty("--fs", fs+"px"); }
  applyFs();
  document.getElementById("btnBigger").addEventListener("click", function(){ fs=Math.min(28,fs+1); applyFs(); savePos(KEY_FS,fs); });
  document.getElementById("btnSmaller").addEventListener("click", function(){ fs=Math.max(15,fs-1); applyFs(); savePos(KEY_FS,fs); });

  // theme override (cycles auto -> light -> dark)
  var theme = localStorage.getItem(KEY_THEME) || "auto";
  function applyTheme(){
    if(theme==="light"){ document.documentElement.style.colorScheme="light"; document.documentElement.setAttribute("data-theme","light"); }
    else if(theme==="dark"){ document.documentElement.style.colorScheme="dark"; document.documentElement.setAttribute("data-theme","dark"); }
    else { document.documentElement.style.colorScheme="light dark"; document.documentElement.removeAttribute("data-theme"); }
  }
  applyTheme();
  document.getElementById("btnTheme").addEventListener("click", function(){
    theme = theme==="auto"?"light":theme==="light"?"dark":"auto";
    localStorage.setItem(KEY_THEME, theme); applyTheme(); toast("Theme: "+theme);
  });

  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll);

  // load
  fetchText(MANIFEST).then(function(txt){
    var files = JSON.parse(txt);
    return Promise.all(files.map(function(f){ return fetchText(DIR+f); }))
      .then(function(texts){ return {files:files, texts:texts}; });
  }).then(function(data){
    render(data.files, data.texts);
    // restore reading position (or jump to #hash)
    if(location.hash && document.getElementById(location.hash.slice(1))){
      document.getElementById(location.hash.slice(1)).scrollIntoView();
    } else {
      var p = loadPos(KEY_PROGRESS);
      if(p) setTimeout(function(){ gotoPos(p); }, 30);
    }
    onScroll();
  }).catch(function(err){
    book.innerHTML = "<p id=\"status\">Could not load the manuscript.<br><br>"+
      "<small>"+esc(String(err && err.message || err))+"</small><br><br>"+
      "This reader loads the Markdown files live, so it needs to be opened from a web host "+
      "(GitHub Pages, or a raw.githack.com link), not straight from a <code>file://</code> path.</small></p>";
  });
})();
</script>
</body>
</html>
