<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower of Ardenmoor</title>
<style>
  :root{
    color-scheme: light dark;
    --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb;
    --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14);
    --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c;
      --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5);
      --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16);
    }
  }
  :root[data-theme="light"]{ color-scheme:light; --bg:#f6f2ea; --fg:#2c2820; --muted:#8a7f6c; --rule:#e3dccb; --accent:#9a6a3a; --bar:#efe9dc; --panel:#fbf8f1; --shadow:rgba(60,45,20,.14); --danger:#b4462f; --edit:#2f7d52; --editbg:rgba(47,125,82,.12); }
  :root[data-theme="dark"]{ color-scheme:dark; --bg:#15120d; --fg:#e9e3d5; --muted:#9c9182; --rule:#2c261c; --accent:#d0a06a; --bar:#1d1912; --panel:#1b1710; --shadow:rgba(0,0,0,.5); --danger:#e0785e; --edit:#6bbd8a; --editbg:rgba(107,189,138,.16); }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    font-size:var(--fs,20px); line-height:1.72; -webkit-font-smoothing:antialiased;
  }
  #progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:60;transition:width .1s linear}
  header#bar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.35rem;
    padding:.5rem .7rem;background:var(--bar);border-bottom:1px solid var(--rule);
    backdrop-filter:saturate(1.2) blur(6px);
  }
  header#bar .title{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header#bar button{position:relative;font:inherit;font-size:.95rem;line-height:1;cursor:pointer;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:8px;padding:.35rem .5rem}
  header#bar button:hover{background:var(--panel);border-color:var(--rule)}
  header#bar .sep{width:1px;height:1.3rem;background:var(--rule);margin:0 .1rem}
  #noteCount{position:absolute;top:-.2rem;right:-.2rem;min-width:1.05rem;height:1.05rem;padding:0 .2rem;background:var(--accent);color:#fff;border-radius:999px;font-size:.62rem;line-height:1.05rem;text-align:center;display:none}
  #noteCount.show{display:block}

  main{max-width:38rem;margin:0 auto;padding:2.5rem 1.4rem 7rem}
  .titlepage{text-align:center;margin:2rem 0 5rem}
  .titlepage h1{font-size:2.5rem;font-weight:600;line-height:1.12;margin:0 0 .7rem;letter-spacing:.01em}
  .titlepage .book{font-variant:small-caps;letter-spacing:.28em;color:var(--muted);margin:0}
  section.chapter{margin-top:4.5rem}
  section.chapter:first-of-type{margin-top:0}
  h2.chap{text-align:center;font-weight:600;font-size:1.35rem;line-height:1.3;margin:0 0 2.4rem}
  h2.chap .kicker{display:block;font-variant:small-caps;letter-spacing:.2em;font-size:.72rem;color:var(--muted);margin-bottom:.55rem}
  p{margin:0;text-indent:1.5em;text-align:justify;hyphens:auto;position:relative}
  p.flush{text-indent:0}
  .scene{margin:1.9rem 0;text-align:center;color:var(--muted);letter-spacing:.6em}
  .scene span{opacity:.6}
  /* commented paragraphs */
  p.hasNote{}
  p.hasNote::before{content:"";position:absolute;left:-.75rem;top:.12em;bottom:.12em;width:3px;border-radius:2px;background:var(--accent);opacity:.75}
  .noteDot{display:inline-block;cursor:pointer;margin-left:.35em;font-size:.7em;vertical-align:.15em;color:var(--accent);opacity:.85;text-indent:0}
  .noteDot:hover{opacity:1}
  /* revised paragraphs (track changes) */
  p.hasEdit::after{content:"";position:absolute;left:-.75rem;top:.12em;bottom:.12em;width:3px;border-radius:2px;background:var(--edit);opacity:.85}
  p.hasNote.hasEdit::after{left:-1.15rem}
  .editDot{display:inline-block;cursor:pointer;margin-left:.35em;font-size:.7em;vertical-align:.15em;color:var(--edit);opacity:.85;text-indent:0}
  .editDot:hover{opacity:1}
  .diff-del{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px;opacity:.85}
  .diff-ins{color:var(--edit);background:var(--editbg);border-radius:3px;padding:0 .06em}
  p.isDeleted{opacity:.7}
  /* selection add buttons */
  #selTools{position:absolute;z-index:55;transform:translate(-50%,-115%);display:none;gap:.3rem;white-space:nowrap}
  #selTools.show{display:flex}
  #selTools button{font:inherit;font-size:.8rem;cursor:pointer;border:0;border-radius:999px;padding:.34rem .7rem;
    background:var(--fg);color:var(--bg);box-shadow:0 4px 16px var(--shadow)}
  #selTools button.edit{background:var(--edit);color:#fff}
  /* composer */
  .composer{margin:.35rem 0 1.1rem;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.6rem;text-indent:0}
  .composer .quote{font-size:.82em;color:var(--muted);font-style:italic;margin:0 0 .45rem;border-left:2px solid var(--rule);padding-left:.55rem}
  .composer textarea{display:block;width:100%;min-height:4.2rem;font:inherit;font-size:.9em;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:.5rem;resize:vertical}
  .composer .row{display:flex;gap:.4rem;margin-top:.5rem;align-items:center}
  .composer button{font:inherit;font-size:.82rem;cursor:pointer;border-radius:8px;padding:.35rem .75rem;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
  .composer button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .composer button.del{margin-left:auto;color:var(--danger);border-color:transparent;background:transparent}
  .composer.edit textarea{min-height:7rem;line-height:1.55}
  .composer.edit button.primary{background:var(--edit);border-color:var(--edit)}
  .composer .hint{font-size:.74rem;color:var(--muted);margin:.4rem 0 0;text-indent:0}
  /* feedback drawer tabs */
  .tabs{display:flex;gap:.3rem;margin:0 1.2rem 1rem}
  .tabs button{flex:1;font:inherit;font-size:.8rem;cursor:pointer;border-radius:8px;padding:.4rem;border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
  .tabs button.active{background:var(--panel);color:var(--fg);border-color:var(--accent);font-weight:600}
  .revItem{padding:.7rem 1.2rem;border-top:1px solid var(--rule)}
  .revItem .ch{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem}
  .revItem .diff{font-size:.86em;line-height:1.5}
  .revItem .tag{display:inline-block;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--edit);border:1px solid var(--edit);border-radius:5px;padding:.02rem .3rem;margin-bottom:.3rem}
  .revItem .tag.cut{color:var(--danger);border-color:var(--danger)}
  .revItem .acts{display:flex;gap:.9rem;margin-top:.45rem}
  .revItem .acts a{font-size:.78rem;color:var(--accent);cursor:pointer;text-decoration:none}
  .revItem .acts a.del{color:var(--danger)}
  /* resolved feedback */
  .resHead{margin:1.1rem 1.2rem .1rem;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:.85rem}
  .noteItem.resolved,.revItem.resolved{opacity:.6}
  .doneTag{display:inline-block;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--edit);border:1px solid var(--edit);border-radius:5px;padding:.02rem .32rem;vertical-align:.12em;margin-left:.3rem}
  .noteItem .acts a.res,.revItem .acts a.res{color:var(--edit)}
  .noteItem .acts a.reopen,.revItem .acts a.reopen{color:var(--muted)}

  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
  #scrim.open{opacity:1;pointer-events:auto}
  aside.drawer{position:fixed;top:0;height:100%;width:min(22rem,86vw);z-index:71;background:var(--panel);box-shadow:0 0 40px var(--shadow);transition:transform .22s ease;overflow-y:auto;padding:1.1rem 0 2rem}
  aside#toc{left:0;border-right:1px solid var(--rule);transform:translateX(-102%)}
  aside#toc.open{transform:none}
  aside#notes{right:0;border-left:1px solid var(--rule);transform:translateX(102%)}
  aside#notes.open{transform:none}
  aside .dh{display:flex;align-items:center;gap:.5rem;margin:.3rem 1.2rem 1rem}
  aside .dh h3{margin:0;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  aside#toc a{display:block;padding:.55rem 1.2rem;color:var(--fg);text-decoration:none;font-size:.98rem;border-left:3px solid transparent}
  aside#toc a:hover{background:var(--bar)}
  aside#toc a.active{border-left-color:var(--accent);color:var(--accent);font-weight:600}
  aside#toc .bm{margin:.6rem 1.2rem 0;padding-top:.9rem;border-top:1px solid var(--rule)}
  aside#toc .bm a{padding-left:0;border:0;color:var(--accent)}
  .exportRow{display:flex;gap:.4rem;margin:0 1.2rem 1rem}
  .exportRow button{flex:1;font:inherit;font-size:.8rem;cursor:pointer;border-radius:8px;padding:.45rem;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
  .exportRow button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .noteItem{padding:.7rem 1.2rem;border-top:1px solid var(--rule)}
  .noteItem .ch{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
  .noteItem .q{font-size:.82em;font-style:italic;color:var(--muted);margin:0 0 .3rem}
  .noteItem .t{font-size:.92em;white-space:pre-wrap}
  .noteItem .acts{display:flex;gap:.9rem;margin-top:.4rem}
  .noteItem .acts a{font-size:.78rem;color:var(--accent);cursor:pointer;text-decoration:none}
  .noteItem .acts a.del{color:var(--danger)}
  .empty{color:var(--muted);padding:1rem 1.2rem;font-size:.9rem}

  #toast{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%) translateY(1.5rem);background:var(--fg);color:var(--bg);padding:.55rem 1rem;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 6px 24px var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #status{max-width:38rem;margin:3rem auto;padding:0 1.4rem;color:var(--muted);text-align:center}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em}
</style>
</head>
<body>
<div id="progress"></div>

<header id="bar">
  <button id="btnToc" title="Contents" aria-label="Contents">☰</button>
  <span class="title">The Tower of Ardenmoor</span>
  <button id="btnNotes" title="Notes &amp; feedback">💬<span id="noteCount">0</span></button>
  <button id="btnMark" title="Bookmark this spot">🔖</button>
  <button id="btnGoto" title="Go to bookmark">↦</button>
  <span class="sep"></span>
  <button id="btnSmaller" title="Smaller text">A−</button>
  <button id="btnBigger" title="Larger text">A+</button>
  <button id="btnTheme" title="Light / dark">◐</button>
</header>

<div id="scrim"></div>
<aside id="toc" class="drawer"><div class="dh"><h3>Contents</h3></div><nav id="tocNav"></nav></aside>
<aside id="notes" class="drawer">
  <div class="dh"><h3>Feedback</h3></div>
  <div class="tabs">
    <button id="tabNotes" class="active" data-pane="notes">Notes</button>
    <button id="tabEdits" data-pane="edits">Track changes</button>
  </div>
  <div class="exportRow">
    <button id="btnCopy" class="primary">Copy for Claude</button>
    <button id="btnDownload">Download .md</button>
  </div>
  <div class="exportRow" style="border-top:1px solid var(--rule);margin-top:.2rem;padding-top:.8rem">
    <button id="btnSync">Turn on cross-device sync</button>
  </div>
  <div id="notesList"></div>
  <div id="editsList" style="display:none"></div>
</aside>

<div id="selTools"><button id="btnAddNote">💬 Note</button><button id="btnAddEdit" class="edit">✏️ Edit</button></div>
<main id="book"><p id="status">Gathering the pages…</p></main>
<div id="toast"></div>

<script>
(function(){
  "use strict";
  var MANIFEST="manuscript/manifest.json", DIR="manuscript/";
  var KEY_PROGRESS="ardenmoor.progress.v1", KEY_BOOKMARK="ardenmoor.bookmark.v1",
      KEY_FS="ardenmoor.fontsize.v1", KEY_THEME="ardenmoor.theme.v1", KEY_NOTES="ardenmoor.comments.v1",
      KEY_REVS="ardenmoor.revisions.v1", KEY_SECRET="ardenmoor.sync.secret.v1";

  var book=document.getElementById("book"), tocNav=document.getElementById("tocNav"),
      notesList=document.getElementById("notesList"), editsList=document.getElementById("editsList"),
      toastEl=document.getElementById("toast"),
      progressEl=document.getElementById("progress"), selTools=document.getElementById("selTools"),
      noteCount=document.getElementById("noteCount");

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function inline(s){ return esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>"); }
  function snip(t){ return t.replace(/\s+/g," ").trim().slice(0,100); }
  function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove("show");},1700); }
  function bust(u){ return u+(u.indexOf("?")<0?"?":"&")+"v="+Date.now(); }
  function fetchText(u){ return fetch(bust(u),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(u+" ("+r.status+")"); return r.text(); }); }

  function parse(md){
    md=md.replace(/\r\n?/g,"\n");
    var raw=md.split(/\n{2,}/), out=[];
    for(var i=0;i<raw.length;i++){
      var b=raw[i].trim(); if(!b) continue;
      if(b==="---"){ out.push({t:"scene"}); continue; }
      if(b.indexOf("### ")===0){ out.push({t:"chapter",text:b.slice(4).trim()}); continue; }
      if(b.indexOf("## ")===0||b.indexOf("# ")===0){ continue; }
      out.push({t:"p",text:b.replace(/\n+/g," ").trim()});
    }
    return out;
  }

  /* ---------- notes storage ---------- */
  function getNotes(){ try{ return JSON.parse(localStorage.getItem(KEY_NOTES))||[]; }catch(e){ return []; } }
  function setNotes(a){ try{ localStorage.setItem(KEY_NOTES, JSON.stringify(a)); }catch(e){} updateCount(); if(typeof SYNC!=="undefined"&&SYNC.pushNotes) SYNC.pushNotes(); }
  function findNote(chap,s){ var a=getNotes(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s&&!a[i].resolved) return a[i]; } return null; }
  function upsertNote(chap,s,quote,text){
    var a=getNotes(), found=false;
    for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].text=text; a[i].quote=quote||a[i].quote; a[i].ts=Date.now(); a[i].resolved=false; a[i].resolvedTs=0; found=true; break; } }
    if(!found) a.push({chap:chap,snip:s,quote:quote||"",text:text,ts:Date.now(),resolved:false});
    setNotes(a);
  }
  function deleteNote(chap,s){ setNotes(getNotes().filter(function(n){ return !(n.chap===chap&&n.snip===s); })); }
  function setNoteResolved(chap,s,val){ var a=getNotes(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].resolved=!!val; a[i].resolvedTs=val?Date.now():0; a[i].ts=Date.now(); } } setNotes(a); }
  function activeCount(arr){ var c=0; for(var i=0;i<arr.length;i++) if(!arr[i].resolved) c++; return c; }
  function updateCount(){ var n=activeCount(getNotes())+activeCount(getRevs()); noteCount.textContent=n; noteCount.classList.toggle("show", n>0); }

  /* ---------- revisions (track changes) storage ---------- */
  function getRevs(){ try{ return JSON.parse(localStorage.getItem(KEY_REVS))||[]; }catch(e){ return []; } }
  function setRevs(a){ try{ localStorage.setItem(KEY_REVS, JSON.stringify(a)); }catch(e){} updateCount(); if(typeof SYNC!=="undefined"&&SYNC.pushRevs) SYNC.pushRevs(); }
  function findRev(chap,s){ var a=getRevs(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s&&!a[i].resolved) return a[i]; } return null; }
  function upsertRev(chap,s,orig,revised){
    var a=getRevs(), found=false;
    for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].original=orig; a[i].revised=revised; a[i].ts=Date.now(); a[i].resolved=false; a[i].resolvedTs=0; a[i].resolvedVia=""; found=true; break; } }
    if(!found) a.push({chap:chap,snip:s,original:orig,revised:revised,ts:Date.now(),resolved:false});
    setRevs(a);
  }
  function deleteRev(chap,s){ setRevs(getRevs().filter(function(r){ return !(r.chap===chap&&r.snip===s); })); }
  function setRevResolved(chap,s,val,via){ var a=getRevs(); for(var i=0;i<a.length;i++){ if(a[i].chap===chap&&a[i].snip===s){ a[i].resolved=!!val; a[i].resolvedTs=val?Date.now():0; a[i].resolvedVia=val?(via||"manual"):""; a[i].ts=Date.now(); } } setRevs(a); }

  /* ---------- verify tracked changes against the LIVE manuscript ---------- */
  function normText(s){ return (s||"").replace(/\s+/g," ").trim(); }
  function chapterLoaded(title){ for(var i=0;i<chapters.length;i++) if(chapters[i].title===title) return true; return false; }
  function origStillPresent(chap,orig){
    var target=normText(orig), ps=book.querySelectorAll("p[data-snip]");
    for(var i=0;i<ps.length;i++){ if(ps[i].dataset.chap===chap && normText(ps[i].dataset.text)===target) return true; }
    return false;
  }
  // A tracked change counts as APPLIED once its original paragraph no longer appears in the
  // manuscript the reader just loaded from GitHub. Applied changes auto-resolve so they don't linger.
  function autoVerifyRevs(){
    if(!chapters.length) return false;
    var a=getRevs(), changed=false;
    for(var i=0;i<a.length;i++){
      var r=a[i];
      if(r.resolved) continue;
      if(!chapterLoaded(r.chap)) continue;                 // can't verify a chapter we didn't load
      if(!origStillPresent(r.chap, r.original)){            // original gone => the edit landed
        r.resolved=true; r.resolvedTs=Date.now(); r.resolvedVia="applied"; r.ts=Date.now(); changed=true;
      }
    }
    if(changed) setRevs(a);
    return changed;
  }

  /* ---------- word-level diff ---------- */
  function tok(s){ return s.replace(/\s+/g," ").trim().split(" ").filter(function(x){ return x!==""; }); }
  function diffWords(a,b){
    var A=tok(a), B=tok(b), n=A.length, m=B.length, i, j;
    var dp=[]; for(i=0;i<=n;i++){ var row=[]; for(j=0;j<=m;j++) row.push(0); dp.push(row); }
    for(i=n-1;i>=0;i--) for(j=m-1;j>=0;j--) dp[i][j]= A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
    var out=[]; i=0; j=0;
    while(i<n&&j<m){
      if(A[i]===B[j]){ out.push({t:"eq",s:A[i]}); i++; j++; }
      else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:"del",s:A[i]}); i++; }
      else { out.push({t:"ins",s:B[j]}); j++; }
    }
    while(i<n){ out.push({t:"del",s:A[i]}); i++; }
    while(j<m){ out.push({t:"ins",s:B[j]}); j++; }
    return out;
  }
  function diffHTML(orig,revised){
    if(!revised||!revised.trim()) return "<span class=\"diff-del\">"+esc(orig.replace(/\s+/g," ").trim())+"</span>";
    var parts=diffWords(orig,revised), html="";
    for(var k=0;k<parts.length;k++){
      var pre=k>0?" ":"", p=parts[k];
      if(p.t==="eq") html+=pre+esc(p.s);
      else if(p.t==="del") html+=pre+"<span class=\"diff-del\">"+esc(p.s)+"</span>";
      else html+=pre+"<span class=\"diff-ins\">"+esc(p.s)+"</span>";
    }
    return html;
  }

  /* ---------- cross-device sync (optional; needs the /api/sync backend) ---------- */
  var SYNC={
    secret:(function(){ try{ return localStorage.getItem(KEY_SECRET)||""; }catch(e){ return ""; } })(),
    on:false, _t:null,
    _h:function(){ return {"Content-Type":"application/json","x-feedback-secret":SYNC.secret}; },
    setSecret:function(s){ SYNC.secret=s; try{ localStorage.setItem(KEY_SECRET,s); }catch(e){} },
    pull:function(){
      if(!SYNC.secret) return Promise.resolve(null);
      return fetch("api/sync",{headers:SYNC._h(),cache:"no-store"})
        .then(function(r){ if(!r.ok) throw new Error("sync "+r.status); return r.json(); })
        .then(function(j){ SYNC.on=!!(j&&j.ok); return j; })
        .catch(function(){ SYNC.on=false; return null; });
    },
    pushNotes:function(){
      if(!SYNC.secret) return;
      clearTimeout(SYNC._t);
      SYNC._t=setTimeout(function(){
        fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({notes:getNotes()})})
          .then(function(r){ SYNC.on=r.ok; }).catch(function(){ SYNC.on=false; });
      },800);
    },
    pushRevs:function(){
      if(!SYNC.secret) return;
      clearTimeout(SYNC._tr);
      SYNC._tr=setTimeout(function(){
        fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({revisions:getRevs()})})
          .then(function(r){ SYNC.on=r.ok; }).catch(function(){ SYNC.on=false; });
      },800);
    },
    pushBookmark:function(bm){
      if(!SYNC.secret) return;
      fetch("api/sync",{method:"POST",headers:SYNC._h(),body:JSON.stringify({bookmark:bm})}).catch(function(){});
    },
    init:function(){
      return SYNC.pull().then(function(j){
        if(j&&j.ok){
          var map={};
          getNotes().concat(j.notes||[]).forEach(function(n){ var k=(n.chap||"")+"|"+(n.snip||""); if(!map[k]||(n.ts||0)>(map[k].ts||0)) map[k]=n; });
          setNotes(Object.keys(map).map(function(k){ return map[k]; }));
          var rmap={};
          getRevs().concat(j.revisions||[]).forEach(function(r){ var k=(r.chap||"")+"|"+(r.snip||""); if(!rmap[k]||(r.ts||0)>(rmap[k].ts||0)) rmap[k]=r; });
          setRevs(Object.keys(rmap).map(function(k){ return rmap[k]; }));
          autoVerifyRevs();
          decorate(); buildNotesList(); buildEditsList();
          if(j.bookmark) savePos(KEY_BOOKMARK, j.bookmark);
        }
        if(typeof updateSyncUI==="function") updateSyncUI();
      });
    }
  };

  var chapters=[]; // {id,title,el}

  function render(texts){
    book.innerHTML="";
    var tp=document.createElement("div"); tp.className="titlepage";
    tp.innerHTML="<h1>The Tower of Ardenmoor</h1><p class=\"book\">Book One</p>";
    book.appendChild(tp);
    chapters=[];
    for(var i=0;i<texts.length;i++){
      var blocks=parse(texts[i]);
      var sec=document.createElement("section"); sec.className="chapter"; sec.id="ch-"+i;
      var title="", flush=true;
      for(var j=0;j<blocks.length;j++){
        var bl=blocks[j];
        if(bl.t==="chapter"){
          title=bl.text;
          var parts=bl.text.split(":"), h=document.createElement("h2"); h.className="chap";
          if(parts.length>1){ h.innerHTML="<span class=\"kicker\">"+esc(parts[0].trim())+"</span>"+esc(parts.slice(1).join(":").trim()); }
          else h.textContent=bl.text;
          sec.appendChild(h); flush=true;
        } else if(bl.t==="scene"){
          var d=document.createElement("div"); d.className="scene"; d.innerHTML="<span>&#10022;</span>"; sec.appendChild(d); flush=true;
        } else {
          var p=document.createElement("p"); if(flush){ p.className="flush"; flush=false; }
          p.innerHTML=inline(bl.text);
          p.dataset.chap=title; p.dataset.snip=snip(bl.text); p.dataset.text=bl.text;
          sec.appendChild(p);
        }
      }
      book.appendChild(sec);
      chapters.push({id:sec.id,title:title||("Part "+(i+1)),el:sec});
    }
    decorate(); buildToc(); updateCount();
    if(autoVerifyRevs()) decorate();
  }

  /* ---------- decorate paragraphs: revision diff + note/edit markers ---------- */
  function decorate(){
    var ps=book.querySelectorAll("p[data-snip]");
    ps.forEach(function(p){
      var chap=p.dataset.chap, s=p.dataset.snip, orig=p.dataset.text||"";
      var rev=findRev(chap,s), note=findNote(chap,s);
      if(rev){
        p.classList.add("hasEdit");
        p.classList.toggle("isDeleted", !(rev.revised&&rev.revised.trim()));
        p.innerHTML=diffHTML(orig, rev.revised);
      } else {
        p.classList.remove("hasEdit","isDeleted");
        p.innerHTML=inline(orig);
      }
      p.classList.toggle("hasNote", !!note);
      if(note){
        var nd=document.createElement("span"); nd.className="noteDot"; nd.textContent="💬"; nd.title="View / edit note";
        nd.addEventListener("click", function(){ openComposer(p, note.quote); });
        p.appendChild(nd);
      }
      if(rev){
        var ed=document.createElement("span"); ed.className="editDot"; ed.textContent="✏️"; ed.title="Edit / revert this revision";
        ed.addEventListener("click", function(){ openEditor(p); });
        p.appendChild(ed);
      }
    });
  }

  /* ---------- composer ---------- */
  function closeComposers(){ var c=document.querySelectorAll(".composer"); c.forEach(function(x){x.remove();}); }
  function openComposer(p, quote){
    closeComposers();
    var chap=p.dataset.chap, s=p.dataset.snip, existing=findNote(chap,s);
    var q=(existing&&existing.quote)||quote||"";
    var box=document.createElement("div"); box.className="composer";
    box.innerHTML=(q?("<p class=\"quote\">"+esc(q.length>220?q.slice(0,220)+"…":q)+"</p>"):"")+
      "<textarea placeholder=\"Your note or feedback about this passage…\"></textarea>"+
      "<div class=\"row\"><button class=\"primary save\">Save note</button><button class=\"cancel\">Cancel</button>"+
      (existing?"<button class=\"del\">Delete</button>":"")+"</div>";
    p.insertAdjacentElement("afterend", box);
    var ta=box.querySelector("textarea"); ta.value=existing?existing.text:""; ta.focus();
    box.querySelector(".save").addEventListener("click", function(){
      var v=ta.value.trim(); if(!v){ toast("Nothing to save"); return; }
      upsertNote(chap,s,q,v); decorate(); buildNotesList(); box.remove(); toast("Note saved");
    });
    box.querySelector(".cancel").addEventListener("click", function(){ box.remove(); });
    var del=box.querySelector(".del");
    if(del) del.addEventListener("click", function(){ deleteNote(chap,s); decorate(); buildNotesList(); box.remove(); toast("Note deleted"); });
    box.scrollIntoView({block:"nearest"});
  }

  /* ---------- track-changes editor ---------- */
  function openEditor(p){
    closeComposers();
    var chap=p.dataset.chap, s=p.dataset.snip, orig=p.dataset.text||"", existing=findRev(chap,s);
    var box=document.createElement("div"); box.className="composer edit";
    box.innerHTML="<p class=\"quote\">Rewrite this paragraph as you want it to read. To cut the passage entirely, clear the box and save.</p>"+
      "<textarea spellcheck=\"true\"></textarea>"+
      "<p class=\"hint\">Saved as a tracked change; the original stays until you or I apply it.</p>"+
      "<div class=\"row\"><button class=\"primary save\">Save revision</button><button class=\"cancel\">Cancel</button>"+
      (existing?"<button class=\"del\">Revert</button>":"")+"</div>";
    p.insertAdjacentElement("afterend", box);
    var ta=box.querySelector("textarea"); ta.value=existing?existing.revised:orig; ta.focus();
    box.querySelector(".save").addEventListener("click", function(){
      var v=ta.value.replace(/\s+$/,"");
      if(v.trim()===orig.trim()){ if(existing){ deleteRev(chap,s); decorate(); buildEditsList(); } box.remove(); toast("No change from the original"); return; }
      upsertRev(chap,s,orig,v); decorate(); buildEditsList(); box.remove();
      toast(v.trim()?"Revision saved":"Marked for deletion");
    });
    box.querySelector(".cancel").addEventListener("click", function(){ box.remove(); });
    var del=box.querySelector(".del");
    if(del) del.addEventListener("click", function(){ deleteRev(chap,s); decorate(); buildEditsList(); box.remove(); toast("Reverted to original"); });
    box.scrollIntoView({block:"nearest"});
  }

  /* ---------- selection -> add note ---------- */
  function paragraphOfSelection(){
    var sel=window.getSelection(); if(!sel||sel.rangeCount===0||sel.isCollapsed) return null;
    var node=sel.getRangeAt(0).commonAncestorContainer;
    var el=node.nodeType===1?node:node.parentElement;
    while(el&&el!==book){ if(el.tagName==="P"&&el.dataset.snip!==undefined) return el; el=el.parentElement; }
    return null;
  }
  var pendingSel=null;
  function onSelect(){
    var p=paragraphOfSelection();
    var sel=window.getSelection();
    if(!p){ selTools.classList.remove("show"); pendingSel=null; return; }
    var rect=sel.getRangeAt(0).getBoundingClientRect();
    pendingSel={ p:p, quote:sel.toString().replace(/\s+/g," ").trim() };
    selTools.style.left=(window.scrollX+rect.left+rect.width/2)+"px";
    selTools.style.top=(window.scrollY+rect.top)+"px";
    selTools.classList.add("show");
  }
  document.addEventListener("mouseup", function(){ setTimeout(onSelect,10); });
  document.addEventListener("touchend", function(){ setTimeout(onSelect,10); });
  selTools.addEventListener("mousedown", function(e){ e.preventDefault(); });
  function consumeSel(){ var p=pendingSel?pendingSel.p:null, q=pendingSel?pendingSel.quote:""; selTools.classList.remove("show"); if(window.getSelection) window.getSelection().removeAllRanges(); return {p:p,q:q}; }
  document.getElementById("btnAddNote").addEventListener("click", function(){ var c=consumeSel(); if(c.p) openComposer(c.p, c.q); });
  document.getElementById("btnAddEdit").addEventListener("click", function(){ var c=consumeSel(); if(c.p) openEditor(c.p); });

  /* ---------- export ---------- */
  function chapIndex(){ var order={}; chapters.forEach(function(c,i){ order[c.title]=i; }); return order; }
  function bySortedChap(items){
    var order=chapIndex();
    return items.slice().sort(function(a,b){ var d=(order[a.chap]==null?99:order[a.chap])-(order[b.chap]==null?99:order[b.chap]); return d!==0?d:(a.ts||0)-(b.ts||0); });
  }
  function exportMarkdown(){
    var notes=getNotes().filter(function(n){ return !n.resolved; }),
        revs=getRevs().filter(function(r){ return !r.resolved; });
    if(!notes.length&&!revs.length) return "";
    var out="# Reader feedback: The Tower of Ardenmoor\n\n";
    out+="Exported "+new Date().toISOString().slice(0,10)+". "+
      notes.length+" note"+(notes.length===1?"":"s")+", "+
      revs.length+" tracked change"+(revs.length===1?"":"s")+".\n";

    if(notes.length){
      out+="\n# Notes\n";
      var byChap={}, order=[];
      bySortedChap(notes).forEach(function(n){ if(!byChap[n.chap]){ byChap[n.chap]=[]; order.push(n.chap); } byChap[n.chap].push(n); });
      order.forEach(function(t){
        out+="\n## "+t+"\n\n";
        byChap[t].forEach(function(n){
          if(n.quote) out+="> "+n.quote+"\n\n";
          else out+="> (near: \""+n.snip+"…\")\n\n";
          out+=n.text+"\n\n";
        });
      });
    }

    if(revs.length){
      out+="\n# Tracked changes\n";
      out+="\nApply these edits to the manuscript. \"Delete this paragraph\" means remove it entirely.\n";
      var rByChap={}, rOrder=[];
      bySortedChap(revs).forEach(function(r){ if(!rByChap[r.chap]){ rByChap[r.chap]=[]; rOrder.push(r.chap); } rByChap[r.chap].push(r); });
      rOrder.forEach(function(t){
        out+="\n## "+t+"\n\n";
        rByChap[t].forEach(function(r){
          out+="ORIGINAL:\n> "+r.original.replace(/\s+/g," ").trim()+"\n\n";
          if(r.revised&&r.revised.trim()) out+="REVISED:\n> "+r.revised.replace(/\s+/g," ").trim()+"\n\n";
          else out+="REVISED: (delete this paragraph)\n\n";
        });
      });
    }
    return out.trim()+"\n";
  }
  function download(name, text){
    var blob=new Blob([text],{type:"text/markdown"}), url=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },0);
  }
  document.getElementById("btnCopy").addEventListener("click", function(){
    var md=exportMarkdown(); if(!md){ toast("No open feedback to copy"); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(function(){ toast("Copied. Paste it to Claude"); }, function(){ fallbackCopy(md); });
    } else fallbackCopy(md);
  });
  function fallbackCopy(md){
    var ta=document.createElement("textarea"); ta.value=md; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied. Paste it to Claude"); }catch(e){ toast("Copy failed; use Download"); }
    document.body.removeChild(ta);
  }
  document.getElementById("btnDownload").addEventListener("click", function(){
    var md=exportMarkdown(); if(!md){ toast("No open feedback to copy"); return; }
    download("ardenmoor-feedback.md", md);
  });
  function updateSyncUI(){
    var b=document.getElementById("btnSync"); if(!b) return;
    b.textContent = !SYNC.secret ? "Turn on cross-device sync" : (SYNC.on ? "Synced across devices ✓" : "Sync on (reconnecting)");
  }
  document.getElementById("btnSync").addEventListener("click", function(){
    var s=window.prompt("Sync password (the FEEDBACK_SECRET you set in Vercel). Links your notes and bookmark across devices.", SYNC.secret||"");
    if(s===null) return;
    SYNC.setSecret(s.trim()); updateSyncUI();
    SYNC.init().then(function(){ toast(SYNC.on?"Sync connected":"Could not reach sync (check the password and that the site is deployed)"); updateSyncUI(); buildNotesList(); });
  });
  updateSyncUI();

  /* ---------- notes list ---------- */
  function goToItem(chap,s){
    closeDrawers();
    var p=findParagraph(chap,s); if(p){ p.scrollIntoView({block:"center"}); return; }
    for(var i=0;i<chapters.length;i++){ if(chapters[i].title===chap){ chapters[i].el.scrollIntoView({block:"start"}); return; } }
  }
  function noteBody(n,qlen){ return "<div class=\"ch\">"+esc(n.chap||"")+(n.resolved?" <span class=\"doneTag\">✓ done</span>":"")+"</div>"+
      (n.quote?"<p class=\"q\">"+esc(n.quote.length>qlen?n.quote.slice(0,qlen)+"…":n.quote)+"</p>":"")+
      "<div class=\"t\">"+esc(n.text)+"</div>"; }
  function buildNotesList(){
    var all=getNotes(), active=[], resolved=[];
    all.forEach(function(n){ (n.resolved?resolved:active).push(n); });
    notesList.innerHTML="";
    if(!active.length&&!resolved.length){ notesList.innerHTML="<div class=\"empty\">No notes yet.<br><br>Select any passage while reading and tap <b>💬 Note</b> to leave feedback here. Then use <b>Copy for Claude</b>, or turn on sync.</div>"; return; }
    bySortedChap(active).forEach(function(n){
      var div=document.createElement("div"); div.className="noteItem";
      div.innerHTML=noteBody(n,160)+"<div class=\"acts\"><a class=\"go\">Go to</a><a class=\"res\">Resolve</a><a class=\"del\">Delete</a></div>";
      div.querySelector(".go").addEventListener("click", function(){ goToItem(n.chap,n.snip); });
      div.querySelector(".res").addEventListener("click", function(){ setNoteResolved(n.chap,n.snip,true); decorate(); buildNotesList(); toast("Note resolved"); });
      div.querySelector(".del").addEventListener("click", function(){ deleteNote(n.chap,n.snip); decorate(); buildNotesList(); });
      notesList.appendChild(div);
    });
    if(resolved.length){
      var h=document.createElement("div"); h.className="resHead"; h.textContent="Resolved ("+resolved.length+")"; notesList.appendChild(h);
      bySortedChap(resolved).forEach(function(n){
        var div=document.createElement("div"); div.className="noteItem resolved";
        div.innerHTML=noteBody(n,120)+"<div class=\"acts\"><a class=\"go\">Go to</a><a class=\"reopen\">Reopen</a><a class=\"del\">Delete</a></div>";
        div.querySelector(".go").addEventListener("click", function(){ goToItem(n.chap,n.snip); });
        div.querySelector(".reopen").addEventListener("click", function(){ setNoteResolved(n.chap,n.snip,false); decorate(); buildNotesList(); toast("Note reopened"); });
        div.querySelector(".del").addEventListener("click", function(){ deleteNote(n.chap,n.snip); decorate(); buildNotesList(); });
        notesList.appendChild(div);
      });
    }
  }
  function buildEditsList(){
    var all=getRevs(), active=[], resolved=[];
    all.forEach(function(r){ (r.resolved?resolved:active).push(r); });
    editsList.innerHTML="";
    if(!active.length&&!resolved.length){ editsList.innerHTML="<div class=\"empty\">No tracked changes yet.<br><br>Select any passage, tap <b>✏️ Edit</b>, and rewrite it (or clear it to cut the passage). Applied edits are detected against the live manuscript and move to <b>Resolved</b> on their own.</div>"; return; }
    bySortedChap(active).forEach(function(r){
      var cut=!(r.revised&&r.revised.trim());
      var div=document.createElement("div"); div.className="revItem";
      div.innerHTML="<div class=\"ch\">"+esc(r.chap||"")+"</div>"+
        "<div class=\"tag"+(cut?" cut":"")+"\">"+(cut?"Deletion":"Revision")+"</div>"+
        "<div class=\"diff\">"+diffHTML(r.original, r.revised)+"</div>"+
        "<div class=\"acts\"><a class=\"go\">Go to</a><a class=\"edit\">Edit</a><a class=\"res\">Resolve</a><a class=\"del\">Revert</a></div>";
      div.querySelector(".go").addEventListener("click", function(){ goToItem(r.chap,r.snip); });
      div.querySelector(".edit").addEventListener("click", function(){ var p=findParagraph(r.chap,r.snip); closeDrawers(); if(p){ p.scrollIntoView({block:"center"}); setTimeout(function(){ openEditor(p); },260); } });
      div.querySelector(".res").addEventListener("click", function(){ setRevResolved(r.chap,r.snip,true,"manual"); decorate(); buildEditsList(); toast("Change resolved"); });
      div.querySelector(".del").addEventListener("click", function(){ deleteRev(r.chap,r.snip); decorate(); buildEditsList(); });
      editsList.appendChild(div);
    });
    if(resolved.length){
      var h=document.createElement("div"); h.className="resHead"; h.textContent="Resolved ("+resolved.length+")"; editsList.appendChild(h);
      bySortedChap(resolved).forEach(function(r){
        var applied=r.resolvedVia==="applied";
        var div=document.createElement("div"); div.className="revItem resolved";
        div.innerHTML="<div class=\"ch\">"+esc(r.chap||"")+" <span class=\"doneTag\">"+(applied?"✓ applied":"✓ resolved")+"</span></div>"+
          "<div class=\"diff\">"+diffHTML(r.original, r.revised)+"</div>"+
          "<div class=\"acts\"><a class=\"go\">Go to</a>"+(applied?"":"<a class=\"reopen\">Reopen</a>")+"<a class=\"del\">Delete</a></div>";
        div.querySelector(".go").addEventListener("click", function(){ goToItem(r.chap,r.snip); });
        var ro=div.querySelector(".reopen"); if(ro) ro.addEventListener("click", function(){ setRevResolved(r.chap,r.snip,false); decorate(); buildEditsList(); toast("Change reopened"); });
        div.querySelector(".del").addEventListener("click", function(){ deleteRev(r.chap,r.snip); decorate(); buildEditsList(); });
        editsList.appendChild(div);
      });
    }
  }
  function findParagraph(chap,s){
    var ps=book.querySelectorAll("p[data-snip]");
    for(var i=0;i<ps.length;i++){ if(ps[i].dataset.chap===chap&&ps[i].dataset.snip===s) return ps[i]; }
    return null;
  }

  /* ---------- TOC + bookmark + progress ---------- */
  function buildToc(){
    tocNav.innerHTML="";
    chapters.forEach(function(c){
      var a=document.createElement("a"); a.href="#"+c.id; a.dataset.id=c.id;
      var t=c.title.replace(/^Chapter\s+[^:]*:\s*/i,"");
      var label=c.title.match(/^Prologue/i)?c.title:(c.title.match(/^Chapter\s+([^:]*)/i)?("Ch "+RegExp.$1.trim()+(t?": "+t:"")):c.title);
      a.textContent=label; a.addEventListener("click", closeDrawers); tocNav.appendChild(a);
    });
    var bm=loadPos(KEY_BOOKMARK);
    if(bm){ var w=document.createElement("div"); w.className="bm"; var a=document.createElement("a"); a.href="#"; a.textContent="🔖 Go to your bookmark";
      a.addEventListener("click", function(e){ e.preventDefault(); gotoPos(bm); closeDrawers(); }); w.appendChild(a); tocNav.appendChild(w); }
  }
  function currentPos(){
    var y=window.scrollY+4, chosen=chapters.length?chapters[0]:null;
    for(var i=0;i<chapters.length;i++){ if(chapters[i].el.offsetTop<=y) chosen=chapters[i]; else break; }
    if(!chosen) return {id:null,offset:window.scrollY};
    return {id:chosen.id,offset:Math.round(window.scrollY-chosen.el.offsetTop)};
  }
  function gotoPos(pos){ if(!pos) return; var el=pos.id&&document.getElementById(pos.id); window.scrollTo(0,Math.max(0,(el?el.offsetTop:0)+(pos.offset||0))); }
  function savePos(k,p){ try{ localStorage.setItem(k,JSON.stringify(p)); }catch(e){} }
  function loadPos(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }

  var ticking=false;
  function onScroll(){
    if(ticking) return; ticking=true;
    requestAnimationFrame(function(){
      var h=document.documentElement.scrollHeight-window.innerHeight;
      progressEl.style.width=(h>0?(window.scrollY/h*100):0)+"%";
      var pos=currentPos();
      tocNav.querySelectorAll("a[data-id]").forEach(function(l){ l.classList.toggle("active", l.dataset.id===pos.id); });
      clearTimeout(onScroll._t); onScroll._t=setTimeout(function(){ savePos(KEY_PROGRESS,pos); },400);
      ticking=false;
    });
  }

  /* ---------- drawers ---------- */
  var toc=document.getElementById("toc"), notes=document.getElementById("notes"), scrim=document.getElementById("scrim");
  function openDrawer(d){ closeDrawers(); d.classList.add("open"); scrim.classList.add("open"); }
  function closeDrawers(){ toc.classList.remove("open"); notes.classList.remove("open"); scrim.classList.remove("open"); }
  document.getElementById("btnToc").addEventListener("click", function(){ toc.classList.contains("open")?closeDrawers():openDrawer(toc); });
  document.getElementById("btnNotes").addEventListener("click", function(){ if(notes.classList.contains("open")) closeDrawers(); else { buildNotesList(); buildEditsList(); openDrawer(notes); } });
  scrim.addEventListener("click", closeDrawers);

  /* feedback tabs */
  var tabNotes=document.getElementById("tabNotes"), tabEdits=document.getElementById("tabEdits");
  function showPane(which){
    var isNotes=which==="notes";
    tabNotes.classList.toggle("active", isNotes); tabEdits.classList.toggle("active", !isNotes);
    notesList.style.display=isNotes?"":"none"; editsList.style.display=isNotes?"none":"";
  }
  tabNotes.addEventListener("click", function(){ showPane("notes"); });
  tabEdits.addEventListener("click", function(){ showPane("edits"); });

  document.getElementById("btnMark").addEventListener("click", function(){ var bm=currentPos(); savePos(KEY_BOOKMARK,bm); if(SYNC.pushBookmark) SYNC.pushBookmark(bm); buildToc(); toast("Bookmarked this spot"); });
  document.getElementById("btnGoto").addEventListener("click", function(){ var bm=loadPos(KEY_BOOKMARK); if(bm){ gotoPos(bm); toast("Jumped to your bookmark"); } else toast("No bookmark yet; tap the ribbon to set one"); });

  var fs=parseInt(loadPos(KEY_FS)||0,10)||20;
  function applyFs(){ document.body.style.setProperty("--fs",fs+"px"); }
  applyFs();
  document.getElementById("btnBigger").addEventListener("click", function(){ fs=Math.min(28,fs+1); applyFs(); savePos(KEY_FS,fs); });
  document.getElementById("btnSmaller").addEventListener("click", function(){ fs=Math.max(15,fs-1); applyFs(); savePos(KEY_FS,fs); });

  var theme=localStorage.getItem(KEY_THEME)||"auto";
  function applyTheme(){ if(theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme",theme); }
  applyTheme();
  document.getElementById("btnTheme").addEventListener("click", function(){ theme=theme==="auto"?"light":theme==="light"?"dark":"auto"; localStorage.setItem(KEY_THEME,theme); applyTheme(); toast("Theme: "+theme); });

  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll);

  fetchText(MANIFEST).then(function(txt){
    var files=JSON.parse(txt);
    return Promise.all(files.map(function(f){ return fetchText(DIR+f); }));
  }).then(function(texts){
    render(texts);
    if(location.hash&&document.getElementById(location.hash.slice(1))) document.getElementById(location.hash.slice(1)).scrollIntoView();
    else { var p=loadPos(KEY_PROGRESS); if(p) setTimeout(function(){ gotoPos(p); },30); }
    onScroll();
    SYNC.init();
  }).catch(function(err){
    book.innerHTML="<p id=\"status\">Could not load the manuscript.<br><br><small>"+esc(String(err&&err.message||err))+
      "</small><br><br>This reader loads the Markdown live, so open it from a web host (Vercel, GitHub Pages) or a local server, not a <code>file://</code> path.</p>";
  });
})();
</script>
</body>
</html>
